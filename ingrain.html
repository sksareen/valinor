const ONES = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
  'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

function numberWords(n) {
  n = Math.floor(Math.abs(n));
  if (n < 20) return ONES[n] || 'zero';
  if (n < 100) {
    const t = Math.floor(n / 10), o = n % 10;
    return TENS[t] + (o ? ' ' + ONES[o] : '');
  }
  if (n < 1000) {
    const h = Math.floor(n / 100), rest = n % 100;
    return ONES[h] + ' hundred' + (rest ? ' ' + numberWords(rest) : '');
  }
  if (n < 10000) {
    const th = Math.floor(n / 1000), rest = n % 1000;
    return ONES[th] + ' thousand' + (rest ? ' ' + numberWords(rest) : '');
  }
  return String(n);
}

function colloquialNumber(n) {
  // "nine eighty-nine" for 989; "three twelve" for 312; "two two fifty" for 2250
  const s = String(n);
  if (s.length === 3) {
    const a = +s[0], b = +s.slice(1);
    if (b < 10) return numberWords(a) + ' oh ' + numberWords(b);
    return numberWords(a) + ' ' + numberWords(b);
  }
  if (s.length === 4) {
    const a = +s.slice(0, 1), b = +s.slice(1);
    // 2250 → "twenty two fifty" / "two thousand…" handled elsewhere; colloquial: first + rest
    if (b >= 100) {
      const mid = Math.floor(b / 100), end = b % 100;
      return numberWords(a) + ' ' + numberWords(mid) + (end ? ' ' + numberWords(end) : '');
    }
    return numberWords(+s.slice(0, 2)) + ' ' + numberWords(+s.slice(2));
  }
  return numberWords(n);
}

function digitForms(n) {
  const spoken = numberWords(n);
  const colloq = colloquialNumber(n);
  const forms = new Set([String(n), spoken, colloq]);
  // also accept fact.spoken override if provided separately at call site
  return [...forms];
}

function ratioSpoken(r) {
  const whole = Math.floor(r);
  const tenths = Math.round((r - whole) * 10);
  if (tenths === 0) return numberWords(whole);
  return numberWords(whole) + ' point ' + numberWords(tenths);
}

// ---------- 2. Card types from FACTS ----------
let _uid = 0;
function makeCard(partial) {
  return { uid: 'c' + (++_uid), shadow: false, revealed: false, matched: false, ...partial };
}

function yearAbs(fact) {
  // Astronomical-style: 60 BCE → -60, 14 CE → 14
  return fact.era === 'BCE' ? -fact.year : fact.year;
}

/** Years between two historical dates (no year 0). */
function yearsBetween(a, b) {
  let d = yearAbs(b) - yearAbs(a);
  if (yearAbs(a) < 0 && yearAbs(b) > 0) d -= 1;
  return d;
}

function yearAccept(fact) {
  const y = String(fact.year);
  const sp = fact.spoken || numberWords(fact.year);
  const era = fact.era;
  const eraSpoken = era === 'BCE' ? ['bce', 'bc', 'before christ'] : ['ce', 'ad', 'common era'];
  const forms = new Set([
    y, sp,
    `${y} ${era}`, `${y} ${era.toLowerCase()}`,
    `${sp} ${era}`, `${sp} ${era.toLowerCase()}`,
    `${y} bc`, `${sp} bc`, `${y} bce`, `${sp} bce`,
    `${y} ad`, `${sp} ad`, `${y} ce`, `${sp} ce`,
  ]);
  if (era === 'BCE') {
    forms.add(`${y} bc`); forms.add(`${sp} bc`);
  } else {
    forms.add(`${y} ad`); forms.add(`${sp} ad`);
  }
  return [...forms, ...eraSpoken.map(e => `${y} ${e}`), ...eraSpoken.map(e => `${sp} ${e}`)];
}

function toCardsFlops(fact) {
  const cards = [];
  const note = fact.note;
  const numForms = [...digitForms(fact.tflops), fact.spoken].filter(Boolean);

  cards.push(makeCard({
    type: 'forward',
    factId: fact.id,
    cue: `${fact.chip} — ${fact.arch}`,
    note,
    answerKind: 'number',
    answerValue: fact.tflops,
    answerDisplay: String(fact.tflops),
    answerUnit: 'teraflops',
    accept: numForms,
  }));

  cards.push(makeCard({
    type: 'reverse',
    factId: fact.id,
    cue: `${fact.tflops} teraflops`,
    note,
    answerKind: 'chip',
    answerValue: fact.chip,
    answerDisplay: fact.chip,
    answerUnit: '',
    accept: [fact.chip, fact.chip.toLowerCase(), normWord(fact.chip)],
  }));

  if (LANDMARK_CARDS && fact.landmark) {
    cards.push(makeCard({
      type: 'landmark',
      factId: fact.id,
      cue: `${fact.chip} in petaflops`,
      note,
      answerKind: 'phrase',
      answerValue: fact.landmark,
      answerDisplay: fact.landmark,
      answerUnit: '',
      accept: [fact.landmark],
    }));
  }
  return cards;
}

function toCardsDates(fact) {
  const display = `${fact.year} ${fact.era}`;
  const labelAccept = [
    fact.label,
    fact.label.toLowerCase(),
    speakNorm(fact.label),
  ];
  // Short aliases for speech
  if (fact.id === 'ides') labelAccept.push('ides', 'assassination', 'caesar assassinated', 'death of caesar');
  if (fact.id === 'rubicon') labelAccept.push('rubicon', 'civil war', 'crosses the rubicon');
  if (fact.id === 'augustus') labelAccept.push('augustus', 'principate', 'octavian becomes augustus');
  if (fact.id === 'augustus-death') labelAccept.push('death of augustus', 'augustus dies', 'end of augustus');
  if (fact.id === 'first-triumvirate') labelAccept.push('first triumvirate', 'triumvirate');
  if (fact.id === 'second-triumvirate') labelAccept.push('second triumvirate');
  if (fact.id === 'carrhae') labelAccept.push('carrhae', 'crassus', 'crassus killed', 'crassus dies');

  return [
    makeCard({
      type: 'forward',
      factId: fact.id,
      cue: `${fact.label} — ${fact.context}`,
      note: fact.note,
      answerKind: 'year',
      answerValue: fact.year,
      answerEra: fact.era,
      answerDisplay: display,
      answerUnit: '',
      accept: yearAccept(fact),
    }),
    makeCard({
      type: 'reverse',
      factId: fact.id,
      cue: display,
      note: fact.note,
      answerKind: 'label',
      answerValue: fact.label,
      answerDisplay: fact.label,
      answerUnit: '',
      accept: labelAccept,
    }),
  ];
}

function toCardsPairs(fact) {
  const ans = fact.answer;
  const accept = new Set([ans, speakNorm(ans)]);
  // lenient fallback: accept the single most distinctive word (STT rarely nails long phrases)
  const words = speakNorm(ans).split(' ').filter(w => w.length > 3).sort((a, b) => b.length - a.length);
  if (words[0]) accept.add(words[0]);
  return [makeCard({
    type: 'forward',
    factId: fact.id,
    cue: fact.prompt,
    note: fact.note,
    answerKind: 'phrase',
    answerValue: ans,
    answerDisplay: ans,
    answerUnit: '',
    accept: [...accept],
  })];
}

function toCards(fact) {
  if (topic().kind === 'dates') return toCardsDates(fact);
  if (topic().kind === 'pairs') return toCardsPairs(fact);
  return toCardsFlops(fact);
}

function relationCardsFlops() {
  const sorted = [...FACTS()].sort((a, b) => a.tflops - b.tflops || a.id.localeCompare(b.id));
  const out = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const a = sorted[i], b = sorted[i + 1];
    const raw = b.tflops / a.tflops;
    const ratio = Math.round(raw * 10) / 10;
    const spoken = ratioSpoken(ratio);
    const accept = [
      String(ratio), ratio.toFixed(1), spoken, spoken + ' x', spoken + ' times',
      'about ' + spoken, 'about ' + spoken + ' x',
    ];
    if (ratio === Math.floor(ratio)) accept.push(String(Math.floor(ratio)));
    const nearest = Math.round(ratio);
    if (Math.abs(ratio - nearest) <= 0.3) {
      const w = numberWords(nearest);
      accept.push(w, w + ' x', 'about ' + w, 'about ' + w + ' x');
    }
    out.push(makeCard({
      type: 'relation',
      factId: a.id + ':' + b.id,
      factKeys: [a.id, b.id],
      cue: `${a.chip} → ${b.chip}`,
      note: null,
      answerKind: 'ratio',
      answerValue: ratio,
      answerDisplay: ratio.toFixed(1) + '×',
      answerUnit: '',
      accept,
      ratioTol: 0.3,
    }));
  }
  return out;
}

function relationCardsDates() {
  const sorted = [...FACTS()].sort((a, b) => yearAbs(a) - yearAbs(b) || a.id.localeCompare(b.id));
  const out = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const a = sorted[i], b = sorted[i + 1];
    const span = yearsBetween(a, b);
    const spoken = numberWords(span);
    const accept = [
      String(span), spoken, spoken + ' years', spoken + ' year',
      'about ' + spoken, 'about ' + spoken + ' years',
      String(span) + ' years',
    ];
    out.push(makeCard({
      type: 'relation',
      factId: a.id + ':' + b.id,
      factKeys: [a.id, b.id],
      cue: `${a.label} → ${b.label}`,
      note: null,
      answerKind: 'span',
      answerValue: span,
      answerDisplay: `${span} ${span === 1 ? 'year' : 'years'}`,
      answerUnit: '',
      accept,
      ratioTol: 0, // exact year counts; still allow ±1 via matcher
    }));
  }
  return out;
}

function relationCards() {
  if (topic().kind === 'dates') return relationCardsDates();
  if (topic().kind === 'pairs') return []; // pairs have no intrinsic ordering to relate
  return relationCardsFlops();
}

function buildDeck() {
  _uid = 0;
  const base = FACTS().flatMap(toCards);
  return base.concat(relationCards());
}

function withDigits(spoken, n) {
  return `${spoken} (${n})`;
}

/** @returns {{ text: string, factId: string|null }[]} */
function buildStudySentencesFlops() {
  const sorted = [...FACTS()].sort((a, b) => a.tflops - b.tflops || a.id.localeCompare(b.id));
  // The pattern is the point: ~2x (sometimes 3x) per generation, with the H200 as the exception.
  const lines = [{ text: 'These are NVIDIA’s data-center GPUs. Each generation roughly doubles — sometimes triples — the dense FP16 tensor compute of the last, with one exception. Teraflops. Say each aloud.', factId: null }];
  for (const fact of sorted) {
    // Spaces not hyphens — STT / numberWords use "twenty five", not "twentyfive"
    const spoken = (fact.spoken || numberWords(fact.tflops)).replace(/-/g, ' ');
    const flops = withDigits(spoken, fact.tflops);
    const yr = fact.year ? ` (${fact.year})` : ''; // year seen, not spoken
    let text;
    if (fact.id === 'v100') text = `The V100 on Volta${yr} delivers ${flops} teraflops — the baseline.`;
    else if (fact.id === 'a100') text = `The A100 on Ampere${yr} steps up to ${flops} teraflops.`;
    else if (fact.id === 'h100') text = `The H100 on Hopper${yr} reaches ${flops} teraflops, just under one petaflop.`;
    else if (fact.id === 'h200') {
      text = `The H200${yr} stays on Hopper at ${flops} teraflops — the exception: same compute as the H100. What changed is memory, ${withDigits('one hundred forty one', 141)} gigabytes of HBM3e versus ${withDigits('eighty', 80)}.`;
    } else if (fact.id === 'b200') text = `The B200 on Blackwell${yr} jumps to ${flops} teraflops.`;
    else if (fact.id === 'rubin') text = `The Rubin GPU${yr} roughly doubles Blackwell to ${flops} teraflops — NVIDIA’s own figures, still preliminary.`;
    else text = `The ${fact.chip} on ${fact.arch}${yr} delivers ${flops} teraflops.`;
    lines.push({ text, factId: fact.id });
  }
  lines.push({ text: 'Now the jumps between neighbors — each roughly a doubling, except the H200.', factId: null });
  for (let i = 0; i < sorted.length - 1; i++) {
    const a = sorted[i], b = sorted[i + 1];
    const ratio = Math.round((b.tflops / a.tflops) * 10) / 10;
    const spoken = ratioSpoken(ratio);
    const text = ratio === 1
      ? `From the ${a.chip} to the ${b.chip} the compute is the same — ${withDigits(spoken, ratio)} times: a memory refresh, not a new engine.`
      : `From the ${a.chip} to the ${b.chip} is about ${withDigits(spoken, ratio)} times the compute.`;
    lines.push({ text, factId: b.id });
  }
  lines.push({ text: 'One caveat: these are dense FP16 numbers. Drop to FP8 and they double; to FP4 on Blackwell and they quadruple — which is why the headline slides quote far larger figures.', factId: null });
  lines.push({ text: 'And it keeps going: Rubin Ultra follows in 2027. NVIDIA now ships a new architecture about every year, so the top number climbs on a roughly yearly clock.', factId: null });
  return lines;
}

/** @returns {{ text: string, factId: string|null }[]} */
function buildStudySentencesDates() {
  const sorted = [...FACTS()].sort((a, b) => yearAbs(a) - yearAbs(b) || a.id.localeCompare(b.id));
  const lines = [
    { text: 'The Republic doesn’t fall in a day — it dies by degrees over thirty years, war by war, until one man holds it all. Say each date aloud.', factId: null },
  ];
  for (const fact of sorted) {
    lines.push({ text: fact.study, factId: fact.id });
    if (fact.note) lines.push({ text: fact.note, factId: fact.id });
  }
  lines.push({ text: 'Now the spans between neighboring events.', factId: null });
  for (let i = 0; i < sorted.length - 1; i++) {
    const a = sorted[i], b = sorted[i + 1];
    const span = yearsBetween(a, b);
    const spoken = numberWords(span);
    const unit = span === 1 ? 'year' : 'years';
    lines.push({
      text: `From the ${a.label} to ${b.label} is ${withDigits(spoken, span)} ${unit}.`,
      factId: b.id,
    });
  }
  return lines;
}

/** @returns {{ text: string, factId: string|null }[]} */
function buildStudySentencesPairs() {
  const lead = topic().studyLead || 'Say each pair aloud — the prompt, then the answer.';
  const lines = [{ text: lead, factId: null }];
  let lastSection = null;
  for (const fact of FACTS()) {
    if (fact.section && fact.section !== lastSection) {
      lines.push({ text: fact.section, factId: null }); // section header, read aloud
      lastSection = fact.section;
    }
    // Curated topics teach with a rich `study` line; quick user topics fall back to the pair.
    lines.push({ text: fact.study || `${fact.prompt} — ${fact.answer}.`, factId: fact.id });
    if (fact.note) lines.push({ text: fact.note, factId: fact.id });
  }
  return lines;
}

function buildStudySentences() {
  if (topic().kind === 'dates') return buildStudySentencesDates();
  if (topic().kind === 'pairs') return buildStudySentencesPairs();
  return buildStudySentencesFlops();
}

/** STT often splits "H100" into "h" + "100" — rejoin before matching. */
function coalesceGpuTokens(words) {
  const letterName = { vee: 'v', ay: 'a', aitch: 'h', bee: 'b' };
  const out = [];
  for (let i = 0; i < words.length; i++) {
    const a = words[i], b = words[i + 1];
    if (b && /^[abhv]$/.test(a) && /^\d{3,4}$/.test(b)) {
      out.push(a + b);
      i++;
      continue;
    }
    const letter = letterName[a];
    if (letter && b && /^\d{3,4}$/.test(b)) {
      out.push(letter + b);
      i++;
      continue;
    }
    out.push(a);
  }
  return out;
}

/**
 * Study voice tokens for read-along.
 * STT often emits "125" / "3.2" instead of spoken forms — expand digits into
 * number-words so the follow can advance. Chip ids (v100) stay coalesced first
 * so bare "100" is not what we get from "H100".
 */
function studySpeechTokens(text) {
  // "3.2" → "3 point 2" before stripping punctuation
  const cleaned = String(text || '')
    .replace(/(\d+)\.(\d+)/g, '$1 point $2')
    .replace(/-/g, ' ');
  const raw = coalesceGpuTokens(normWords(cleaned));
  const out = [];
  for (const w of raw) {
    if (/^\d+$/.test(w)) {
      const n = parseInt(w, 10);
      if (n >= 1 && n <= 99999) {
        out.push(...normWords(numberWords(n)));
        continue;
      }
    }
    out.push(w);
  }
  return out;
}

/** If STT said a digit, skip a whole spoken-number run at `from` when it equals that value. */
function tryConsumeSpokenNumber(from, n) {
  for (let len = 1; len <= 8; len++) {
    if (from + len > studyWords.length) break;
    const slice = studyWords.slice(from, from + len).map(w => w.norm).join(' ');
    // Don't swallow non-number words (chip names, "teraflops", …)
    if (wordToInt(slice) === n) return from + len;
  }
  return from;
}

function studyWordMatch(scriptNorm, heard) {
  if (!scriptNorm || !heard) return false;
  // Chip ids: exact only (prevents "100" ⊆ "v100")
  if (/^[a-z]\d{2,4}$/.test(scriptNorm) || /^[a-z]\d{2,4}$/.test(heard)) {
    return scriptNorm === heard;
  }
  if (scriptNorm === heard) return true;
  // Short words: exact only — stops "in"/"to"/"of" from leaping ahead
  if (scriptNorm.length <= 3 || heard.length <= 3) return false;
  // Prefix only (no .includes) — STT partials OK, random substring jumps not
  return (scriptNorm.length > 4 && heard.length > 3 &&
    (scriptNorm.startsWith(heard) || heard.startsWith(scriptNorm)));
}

function factKeysOf(card) {
  if (card.factKeys) return card.factKeys;
  return [card.factId];
}

function sharesFact(a, b) {
  const ka = factKeysOf(a), kb = factKeysOf(b);
  return ka.some(k => kb.includes(k));
}

// ---------- 9. Constrained shuffle ----------
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function adjacencyOk(arr) {
  for (let i = 1; i < arr.length; i++) if (sharesFact(arr[i - 1], arr[i])) return false;
  return true;
}

function constrainedShuffle(deck) {
  for (let attempt = 0; attempt < 800; attempt++) {
    const a = shuffleArray(deck);
    if (adjacencyOk(a)) return a;
  }
  // Backtracking placement (deck is small)
  const remaining = deck.slice();
  const out = [];
  function bt() {
    if (!remaining.length) return true;
    // Try least-constrained candidates first (fewest fact overlaps with last)
    const order = remaining.map((c, i) => i);
    if (out.length) {
      order.sort((i, j) => {
        const si = sharesFact(out[out.length - 1], remaining[i]) ? 1 : 0;
        const sj = sharesFact(out[out.length - 1], remaining[j]) ? 1 : 0;
        return si - sj;
      });
    }
    for (const i of order) {
      const c = remaining[i];
      if (out.length && sharesFact(out[out.length - 1], c)) continue;
      remaining.splice(i, 1);
      out.push(c);
      if (bt()) return true;
      out.pop();
      remaining.splice(i, 0, c);
    }
    return false;
  }
  if (bt() && adjacencyOk(out)) return out;
  // Last resort: return best-effort shuffle (should be rare)
  return shuffleArray(deck);
}

/** Stable session order when Shuffle is off (adjacency-safe). Reshuffled each loop when on. */
let sessionOrderTemplate = null;

function fixedOrConstrained(sourceDeck, doShuffle) {
  if (doShuffle) return constrainedShuffle(sourceDeck);
  const srs = srsOrder(sourceDeck);
  if (srs) return srs;
  if (!sessionOrderTemplate) {
    let ok = true;
    for (let i = 1; i < sourceDeck.length; i++) {
      if (sharesFact(sourceDeck[i - 1], sourceDeck[i])) { ok = false; break; }
    }
    sessionOrderTemplate = ok ? sourceDeck.slice() : constrainedShuffle(sourceDeck);
  }
  // Remap template fact/type sequence onto fresh clones from sourceDeck
  const pool = sourceDeck.slice();
  const out = [];
  for (const t of sessionOrderTemplate) {
    const idx = pool.findIndex(c => c.type === t.type && c.factId === t.factId && !c.shadow);
    if (idx >= 0) out.push(pool.splice(idx, 1)[0]);
  }
  return out.concat(pool);
}

// ---------- 3. Phase + fade ----------
let phase = 'study';     // study | handoff | recall | done
let shuffleOn = false;
let totalLoops = 3;      // recall passes only
let recallLoop = 0;      // 1-based during recall
let deck = [];           // full interleaved deck (for recall)
let queue = [];
let queueIndex = 0;
let sessionDone = false;
let studyWords = [];     // [{ norm, el }] current study answer line
let matchedIndex = 0;
let utterAnchor = 0;

function fadeLevelFor() {
  if (phase === 'study' || phase === 'handoff') return 0;
  if (recallLoop <= 1) return 1;
  return 2;
}

function updatePhaseUI() {
  const lens = $('lensline');
  const reveal = $('revealBtn');
  const skip = $('skipQuizBtn');
  if (phase === 'study') {
    lens.textContent = '▲ STUDY — READ THE MAP';
    reveal.style.display = 'none';
    skip.style.display = '';
  } else if (phase === 'recall') {
    lens.textContent = `▲ QUIZ — SAY THE ANSWER · ${recallLoop}/${totalLoops}`;
    reveal.style.display = '';
    skip.style.display = 'none';
  } else {
    reveal.style.display = 'none';
    skip.style.display = 'none';
  }
  // Timeline only in study — it has the answers, so hide in quiz
  if (phase === 'study') renderTimeline();
  else {
    $('timeline').classList.remove('show');
    document.body.classList.remove('timeline-on');
  }
}

function maskDigits(display, fade) {
  // display like "989" or "3.2×" — mask alnum, keep punctuation spacing
  const chars = [...display];
  if (fade <= 0) return display;
  let firstKept = false;
  return chars.map(ch => {
    if (!/[0-9A-Za-z]/.test(ch)) return ch;
    if (fade === 1 && !firstKept) { firstKept = true; return ch; }
    return '_';
  }).join(' ').replace(/ +/g, ' ');
}

function placeholderFor(card, fade) {
  if (card.matched || card.revealed) return card.answerDisplay + (card.answerUnit ? ' ' + card.answerUnit : '');
  const base = card.answerDisplay;
  if (fade <= 0) {
    // Study / loop1: show digits/text but recognition guard still forbids putting
    // "the answer" as the matchable secret — for fade 0 the cue IS visible study text.
    // Spec: loop 1 fade 0 all digits shown. Real value may be shown at fade 0.
    return base + (card.answerUnit ? ' ' + card.answerUnit : '');
  }
  // fade ≥ 1: placeholder only — never the real string as contiguous answer
  const masked = maskDigits(base, fade);
  return masked + (card.answerUnit ? ' ' + card.answerUnit : '');
}

// Real answer held only in card object; DOM gets placeholder until reveal/match.
function answerTextForDom(card, fade) {
  if (card.matched || card.revealed) {
    return card.answerDisplay + (card.answerUnit ? ' ' + card.answerUnit : '');
  }
  if (fade <= 0) {
    // Visible study text is intentional at fade 0; still speech-gated to advance.
    return card.answerDisplay + (card.answerUnit ? ' ' + card.answerUnit : '');
  }
  return placeholderFor(card, fade);
}

// ---------- 8. Matching ----------
const normWord = (s) => String(s).toLowerCase().replace(/[^a-z0-9']/g, '');
const normWords = (s) => String(s).toLowerCase().split(/\s+/).map(normWord).filter(Boolean);

function speakNorm(s) {
  return normWords(s).join(' ');
}

function parseSpokenRatio(text) {
  // pull a number like 3.2 or "three point two" from heard text
  const raw = text.toLowerCase();
  const m = raw.match(/(\d+\.?\d*)/);
  if (m) return parseFloat(m[1]);
  const n = speakNorm(raw).replace(/\b(about|times|x|ex)\b/g, ' ').replace(/\s+/g, ' ').trim();
  // three point two
  const pm = n.match(/^(.+?)\s+point\s+(.+)$/);
  if (pm) {
    const whole = wordToInt(pm[1]);
    const frac = wordToInt(pm[2]);
    if (whole != null && frac != null) return whole + frac / 10;
  }
  const wholeOnly = wordToInt(n);
  if (wholeOnly != null) return wholeOnly;
  return null;
}

function wordToInt(phrase) {
  const map = {
    zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9,
    ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15,
    sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19,
    twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90,
    hundred: 100, thousand: 1000,
  };
  // Hyphens → spaces ("twenty-five" from FACTS.spoken / STT variants)
  const parts = speakNorm(String(phrase).replace(/-/g, ' ')).split(' ').filter(Boolean);
  if (!parts.length) return null;
  let total = 0, current = 0, saw = false;
  for (const p of parts) {
    if (!(p in map)) continue; // skip filler ("teraflops", "the", …)
    saw = true;
    const v = map[p];
    if (v === 100) { current = (current || 1) * 100; }
    else if (v === 1000) { total += (current || 1) * 1000; current = 0; }
    else current += v;
  }
  return saw ? total + current : null;
}

function heardHasAccept(heard, acceptList) {
  const heardSpaced = heard.replace(/-/g, ' ');
  for (const a of acceptList) {
    const na = speakNorm(String(a).replace(/-/g, ' '));
    if (!na) continue;
    if (heardSpaced === na) return true;
    if (na.includes(' ')) {
      if (heardSpaced.includes(na)) return true;
    } else if (heardSpaced.split(' ').includes(na)) {
      return true;
    }
  }
  return false;
}

function answerMatches(card, heardText) {
  const raw = String(heardText || '');
  const heard = speakNorm(raw.replace(/-/g, ' '));
  if (!heard) return false;

  if (card.answerKind === 'ratio') {
    const n = parseSpokenRatio(raw);
    if (n != null && Math.abs(n - card.answerValue) <= (card.ratioTol || 0.3)) return true;
    return heardHasAccept(heard, card.accept);
  }

  if (card.answerKind === 'span') {
    // Years between events — accept exact or ±1 (year-0 edge cases)
    if (new RegExp('\\b' + card.answerValue + '\\b').test(raw.replace(/,/g, ''))) return true;
    if (heardHasAccept(heard, card.accept)) return true;
    const n = wordToInt(raw);
    return n != null && Math.abs(n - card.answerValue) <= 1;
  }

  if (card.answerKind === 'year') {
    const hasYear =
      new RegExp('\\b' + card.answerValue + '\\b').test(raw.replace(/,/g, '')) ||
      wordToInt(raw) === card.answerValue ||
      heardHasAccept(heard, card.accept);
    if (!hasYear) return false;
    // If speaker names an era, it must agree (bare "49" is OK)
    const saidBce = /\b(bce|bc)\b/.test(heard);
    const saidCe = /\b(ce|ad)\b/.test(heard);
    if (saidBce && card.answerEra === 'CE') return false;
    if (saidCe && card.answerEra === 'BCE') return false;
    return true;
  }

  if (card.answerKind === 'number') {
    if (new RegExp('\\b' + card.answerValue + '\\b').test(raw.replace(/,/g, ''))) return true;
    if (heardHasAccept(heard, card.accept)) return true;
    const asNum = wordToInt(raw);
    return asNum === card.answerValue;
  }

  if (card.answerKind === 'chip') {
    const target = normWord(card.answerValue);
    const words = coalesceGpuTokens(normWords(raw));
    return words.some(w => w === target || studyWordMatch(target, w));
  }

  if (card.answerKind === 'label') {
    return heardHasAccept(heard, card.accept);
  }

  return heardHasAccept(heard, card.accept);
}

const fuzzy = (a, b) => !a || !b ? false :
  (a === b || (a.length > 3 && b.length > 3 && (a.startsWith(b) || b.startsWith(a) || a.includes(b) || b.includes(a))));

// ---------- 7. Latency ----------
const latencyLog = [];
let presentation = null; // current presentation record

function beginPresentation(card) {
  const fade = fadeLevelFor();
  presentation = {
    cardId: card.factId,
    type: card.type,
    uid: card.uid,
    loopIndex: phase === 'study' ? 0 : recallLoop,
    phase,
    fadeLevel: fade,
    tCue: performance.now(),
    tFirstSpeech: null,
    tMatch: null,
    revealed: !!card.revealed,
    attempts: 0,
  };
  matchedIndex = 0;
  utterAnchor = 0;
}

function noteSpeech() {
  if (!presentation) return;
  if (presentation.tFirstSpeech == null) presentation.tFirstSpeech = performance.now();
}

function finishPresentation(matched) {
  if (!presentation) return;
  if (matched) presentation.tMatch = performance.now();
  presentation.revealed = presentation.revealed || !!(queue[queueIndex] && queue[queueIndex].revealed);
  latencyLog.push({ ...presentation });
  presentation = null;
}

function dumpLatency() {
  console.table(latencyLog.map(r => ({
    cardId: r.cardId,
    type: r.type,
    loopIndex: r.loopIndex,
    fadeLevel: r.fadeLevel,
    msToSpeech: r.tFirstSpeech != null ? Math.round(r.tFirstSpeech - r.tCue) : null,
    msToMatch: r.tMatch != null ? Math.round(r.tMatch - r.tCue) : null,
    revealed: r.revealed,
    attempts: r.attempts,
  })));
  try {
    localStorage.setItem('ingrain:lastSession', JSON.stringify({
      endedAt: Date.now(),
      records: latencyLog,
    }));
  } catch (e) {}
}

// ---------- spaced repetition — persists across sessions ----------
// Leitner boxes. Box index → days until the fact is due again.
// Box 0 = new or just-lapsed (due now); higher box = better known, longer rest.
const SRS_KEY = 'ingrain:mem:v1';
const SRS_INTERVALS = [0, 1, 3, 7, 16, 35, 90];
const DAY = 86400000;

function srsLoad() {
  try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; } catch (e) { return {}; }
}
function srsSave(store) {
  try { localStorage.setItem(SRS_KEY, JSON.stringify(store)); } catch (e) {}
}
function srsKey(tid, fid) { return tid + '::' + fid; }
function srsGet(store, tid, fid) {
  return store[srsKey(tid, fid)] || { box: 0, reps: 0, lapses: 0, lastSeen: 0, dueAt: 0, ms: null };
}
function srsDue(rec, now) { return (rec.dueAt || 0) <= now; }

// grade: 'good' promote · 'hold' keep box · 'lapse' demote
function srsApply(rec, grade, now, matchMs) {
  const r = { ...rec };
  if (grade === 'good') r.box = Math.min(SRS_INTERVALS.length - 1, r.box + 1);
  else if (grade === 'lapse') { r.box = Math.max(0, r.box - 1); r.lapses = (r.lapses || 0) + 1; }
  r.reps = (r.reps || 0) + 1;
  r.lastSeen = now;
  r.dueAt = now + SRS_INTERVALS[r.box] * DAY;
  if (matchMs != null) r.ms = r.ms == null ? Math.round(matchMs) : Math.round(r.ms * 0.6 + matchMs * 0.4);
  return r;
}

/** Roll this session's recall results into per-fact strength and persist. */
function commitSrsGrades() {
  const now = Date.now();
  const store = srsLoad();
  const byFact = new Map();
  for (const r of latencyLog) {
    if (r.phase !== 'recall') continue;
    if (r.type !== 'forward' && r.type !== 'reverse') continue; // relations are derived
    let g = byFact.get(r.cardId);
    if (!g) { g = { revealed: false, attempts: 0, times: [] }; byFact.set(r.cardId, g); }
    if (r.revealed) g.revealed = true;
    g.attempts += r.attempts || 0;
    if (r.tMatch != null) g.times.push(r.tMatch - r.tCue);
  }
  for (const [fid, g] of byFact) {
    const matched = g.times.length > 0;
    const med = median(g.times);
    let grade;
    if (g.revealed || !matched) grade = 'lapse';        // needed the answer, or never got it
    else if (g.attempts > 0) grade = 'hold';            // got it, but stumbled first
    else if (med != null && med > 6000) grade = 'hold'; // clean but slow
    else grade = 'good';                                // clean and quick
    store[srsKey(topicId, fid)] = srsApply(srsGet(store, topicId, fid), grade, now, med);
  }
  srsSave(store);
}

function srsPriority(card, store, now) {
  let p = -1;
  for (const fid of factKeysOf(card)) {
    const rec = srsGet(store, topicId, fid);
    const due = srsDue(rec, now) ? 100 : 0;
    const weak = (SRS_INTERVALS.length - 1 - rec.box) * 10;
    const overdueDays = Math.max(0, Math.min(50, (now - (rec.dueAt || 0)) / DAY));
    p = Math.max(p, due + weak + overdueDays);
  }
  return p;
}

/** Weakest / most-overdue fact leads, then fill keeping the no-same-fact-adjacent
 *  rule. Places the most-constrained card first (standard reorganize-string greedy);
 *  falls back to the proven constrained shuffle if spacing still can't hold.
 *  Returns null when this topic has no history yet (first-run order unchanged). */
function srsOrder(sourceDeck) {
  const store = srsLoad();
  const now = Date.now();
  if (!FACTS().some(f => (store[srsKey(topicId, f.id)] || {}).reps)) return null;
  const pri = c => srsPriority(c, store, now);
  const lead = sourceDeck.reduce((best, c) => pri(c) > pri(best) ? c : best, sourceDeck[0]);
  const remaining = sourceDeck.filter(c => c !== lead);
  const out = [lead];
  const remCount = card => remaining.reduce((n, c) => n + (c !== card && sharesFact(c, card) ? 1 : 0), 0);
  while (remaining.length) {
    const prev = out[out.length - 1];
    let pool = remaining.filter(c => !sharesFact(prev, c));
    if (!pool.length) pool = remaining.slice(); // forced repeat (rare) — handled by fallback below
    pool.sort((a, b) => remCount(b) - remCount(a) || pri(b) - pri(a));
    const pick = pool[0];
    remaining.splice(remaining.indexOf(pick), 1);
    out.push(pick);
  }
  return adjacencyOk(out) ? out : constrainedShuffle(sourceDeck);
}

function relDay(ts, now) {
  const d = Math.round((ts - now) / DAY);
  if (d <= 0) return 'today';
  if (d === 1) return 'tomorrow';
  return 'in ' + d + ' days';
}

function srsSchedule() {
  const now = Date.now();
  const store = srsLoad();
  let dueNow = 0, nextDue = Infinity;
  for (const f of FACTS()) {
    const rec = srsGet(store, topicId, f.id);
    if (!rec.reps) continue;
    if (srsDue(rec, now)) dueNow++;
    else nextDue = Math.min(nextDue, rec.dueAt);
  }
  return { dueNow, nextDue: nextDue === Infinity ? null : nextDue };
}

function masteryRows() {
  const store = srsLoad();
  const now = Date.now();
  const max = SRS_INTERVALS.length - 1;
  return FACTS().map(f => {
    const rec = srsGet(store, topicId, f.id);
    const label = f.chip || f.label || f.term || f.prompt || f.id;
    const pips = '●'.repeat(rec.box) + '○'.repeat(max - rec.box);
    return `<tr><td>${label}</td><td class="pips">${pips}</td><td>${rec.reps ? relDay(rec.dueAt, now) : '—'}</td></tr>`;
  }).join('');
}

// ---------- render / scroll ----------
let cardEls = new Map(); // uid -> { root, answerEl, cueWords }
const ANCHOR = 0.45;

function fitFont() {
  const w = prompter.clientWidth;
  scrollEl.style.fontSize = Math.max(20, Math.min(46, w / 24)) + 'px';
  const h = prompter.clientHeight;
  scrollEl.style.paddingTop = Math.round(h * ANCHOR) + 'px';
  scrollEl.style.paddingBottom = Math.round(h * (1 - ANCHOR)) + 'px';
}
addEventListener('resize', fitFont);

let scrollY = 0, scrollTargetY = 0, lastTs = 0;
let snapScrollOnSpeech = true; // after mouse browse, speech snaps back to current word
function scrollMax() {
  return Math.max(0, scrollEl.scrollHeight - prompter.clientHeight * 0.45);
}
function resetScroll() { scrollY = 0; scrollTargetY = 0; scrollEl.style.transform = 'translateY(0px)'; }
function scrollToCard(uid) {
  const entry = cardEls.get(uid);
  if (!entry) return;
  const wr = entry.root.getBoundingClientRect(), pr = prompter.getBoundingClientRect();
  const offset = (wr.top - pr.top) + scrollY;
  scrollTargetY = Math.max(0, offset - prompter.clientHeight * ANCHOR);
}
function tickScroll(ts) {
  const dt = lastTs ? (ts - lastTs) / 1000 : 0; lastTs = ts;
  scrollY += (scrollTargetY - scrollY) * Math.min(1, dt * 6);
  scrollEl.style.transform = `translateY(${-scrollY}px)`;
  requestAnimationFrame(tickScroll);
}
requestAnimationFrame(tickScroll);

// Mouse wheel: free browse; talking snaps back to the active word
prompter.addEventListener('wheel', (e) => {
  e.preventDefault();
  snapScrollOnSpeech = false;
  scrollTargetY = Math.min(scrollMax(), Math.max(0, scrollTargetY + e.deltaY));
  scrollY = scrollTargetY;
}, { passive: false });

function appendLineWords(el, line) {
  // Split so "(125)" stays one token for visual-only digits
  String(line).split(/(\s+|\(\d+\))/).forEach(tok => {
    if (!tok) return;
    if (/^\s+$/.test(tok)) { el.appendChild(document.createTextNode(tok)); return; }
    const span = document.createElement('span');
    // Bracket digits are seen, not spoken — skip voice-follow tracking
    if (/^\(\d+\)$/.test(tok)) {
      span.className = 'study-num';
      span.textContent = tok;
      el.appendChild(span);
      return;
    }
    span.className = 'w';
    span.textContent = tok;
    el.appendChild(span);
    const norm = normWord(tok);
    if (norm) studyWords.push({ norm, el: span });
  });
}

let studySegments = []; // { factId, start, end } word ranges for timeline sync

function updateStudyWordStyles() {
  studyWords.forEach((w, i) => {
    w.el.classList.toggle('done', i < matchedIndex);
    w.el.classList.toggle('cur', i === matchedIndex && i < studyWords.length);
  });
  updateTimelineHighlight();
}

function scrollToStudyWord(i) {
  const w = studyWords[i];
  if (!w) return;
  const wr = w.el.getBoundingClientRect(), pr = prompter.getBoundingClientRect();
  const offset = (wr.top - pr.top) + scrollY;
  scrollTargetY = Math.max(0, Math.min(scrollMax(), offset - prompter.clientHeight * ANCHOR));
  snapScrollOnSpeech = true;
}

/** Call when speech advances — snap viewport back to the live word. */
function snapToSpeechWord() {
  if (phase !== 'study') return;
  const i = matchedIndex < studyWords.length ? matchedIndex : Math.max(0, studyWords.length - 1);
  scrollToStudyWord(i);
}

function currentStudyFactId() {
  if (!studySegments.length) return null;
  const i = Math.min(Math.max(0, matchedIndex), Math.max(0, studyWords.length - 1));
  for (const seg of studySegments) {
    if (seg.factId && i >= seg.start && i < seg.end) return seg.factId;
  }
  let last = null;
  for (const seg of studySegments) {
    if (seg.factId && seg.end <= matchedIndex) last = seg.factId;
  }
  return last;
}

function timelineItems() {
  if (topic().kind === 'dates') {
    return [...FACTS()]
      .sort((a, b) => yearAbs(a) - yearAbs(b) || a.id.localeCompare(b.id))
      .map(f => ({ id: f.id, year: `${f.year} ${f.era}`, label: f.label }));
  }
  return [...FACTS()]
    .sort((a, b) => a.tflops - b.tflops || a.id.localeCompare(b.id))
    .map(f => ({ id: f.id, year: String(f.tflops), label: f.chip }));
}

function renderTimeline() {
  const el = $('timeline');
  const rail = $('timelineRail');
  const show = phase === 'study' && topic().kind !== 'pairs';
  el.classList.toggle('show', show);
  document.body.classList.toggle('timeline-on', show);
  if (!show) { rail.innerHTML = ''; return; }
  rail.innerHTML = '';
  timelineItems().forEach(item => {
    const node = document.createElement('div');
    node.className = 'tl-node';
    node.dataset.id = item.id;
    node.innerHTML = `<div class="tl-year">${item.year}</div><div class="tl-label">${item.label}</div>`;
    rail.appendChild(node);
  });
  updateTimelineHighlight();
}

function updateTimelineHighlight() {
  const rail = $('timelineRail');
  if (!$('timeline').classList.contains('show')) return;
  let curId = null;
  if (phase === 'study') curId = currentStudyFactId();
  const nodes = [...rail.querySelectorAll('.tl-node')];
  const curIdx = nodes.findIndex(n => n.dataset.id === curId);
  nodes.forEach((node, idx) => {
    node.classList.toggle('cur', node.dataset.id === curId);
    node.classList.toggle('done', curIdx >= 0 && idx < curIdx);
  });
  const curNode = rail.querySelector('.tl-node.cur');
  if (curNode) {
    const r = curNode.getBoundingClientRect(), tr = $('timeline').getBoundingClientRect();
    if (r.top < tr.top + 20 || r.bottom > tr.bottom - 20) {
      curNode.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

/** Study: one connected prose script — speak every word including chip names. */
function renderStudyScript() {
  scrollEl.innerHTML = '';
  cardEls = new Map();
  studyWords = [];
  studySegments = [];
  matchedIndex = 0;
  utterAnchor = 0;
  const wrap = document.createElement('div');
  wrap.className = 'study-prose';
  const sentences = buildStudySentences();
  sentences.forEach((sentence, i) => {
    const line = document.createElement('div');
    line.className = i === 0 ? 'study-line study-lead' : 'study-line';
    const start = studyWords.length;
    appendLineWords(line, sentence.text);
    studySegments.push({ factId: sentence.factId, start, end: studyWords.length });
    wrap.appendChild(line);
  });
  scrollEl.appendChild(wrap);
  fitFont();
  renderTimeline();
  updateStudyWordStyles();
  resetScroll();
}

function renderQueue() {
  // Recall card queue only
  const fade = fadeLevelFor();
  scrollEl.innerHTML = '';
  cardEls = new Map();
  studyWords = [];
  queue.forEach((card, i) => {
    const root = document.createElement('div');
    root.className = 'card';
    if (i === queueIndex) root.classList.add('cur');
    if (card.matched && i !== queueIndex) root.classList.add('done');

    const cue = document.createElement('div');
    cue.className = 'cue';
    cue.textContent = card.cue;
    root.appendChild(cue);

    if (card.note) {
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = card.note;
      root.appendChild(note);
    }

    const ans = document.createElement('div');
    ans.className = 'answer';
    const showReal = card.matched || card.revealed;
    ans.textContent = answerTextForDom(card, fade);
    if (!showReal && fade >= 1) ans.classList.add('masked');
    if (card.revealed && !card.matched) ans.classList.add('revealed');
    if (card.matched) ans.classList.add('matched');
    root.appendChild(ans);
    scrollEl.appendChild(root);
    cardEls.set(card.uid, { root, answerEl: ans });
  });
  fitFont();
  const cur = queue[queueIndex];
  if (cur) scrollToCard(cur.uid);
  updateTimelineHighlight();
}

function updateCurrentDom() {
  if (phase === 'study') {
    updateStudyWordStyles();
    return;
  }
  const fade = fadeLevelFor();
  queue.forEach((card, i) => {
    const entry = cardEls.get(card.uid);
    if (!entry) return;
    entry.root.classList.toggle('cur', i === queueIndex);
    entry.root.classList.toggle('done', card.matched && i !== queueIndex);
    const showReal = card.matched || card.revealed;
    entry.answerEl.textContent = answerTextForDom(card, fade);
    entry.answerEl.classList.toggle('masked', !showReal && fade >= 1);
    entry.answerEl.classList.toggle('revealed', card.revealed && !card.matched);
    entry.answerEl.classList.toggle('matched', !!card.matched);
  });
  const cur = queue[queueIndex];
  if (cur) scrollToCard(cur.uid);
  updateTimelineHighlight();
}

// ---------- session / queue machine ----------
function cloneCard(card, shadow) {
  return makeCard({
    type: card.type,
    factId: card.factId,
    factKeys: card.factKeys,
    cue: card.cue,
    note: card.note,
    answerKind: card.answerKind,
    answerValue: card.answerValue,
    answerEra: card.answerEra,
    answerDisplay: card.answerDisplay,
    answerUnit: card.answerUnit,
    spokenLine: card.spokenLine,
    accept: (card.accept || []).slice(),
    ratioTol: card.ratioTol,
    shadow: !!shadow,
    revealed: false,
    matched: false,
  });
}

function currentCard() {
  return queue[queueIndex] || null;
}

function startStudy() {
  phase = 'study';
  recallLoop = 0;
  queue = [];
  queueIndex = 0;
  resetScroll();
  updatePhaseUI();
  renderStudyScript();
  beginPresentation({
    factId: 'study-script',
    type: 'study',
    uid: 'study',
    revealed: false,
    matched: false,
  });
}

function startRecallLoop() {
  phase = 'recall';
  sessionOrderTemplate = shuffleOn ? null : sessionOrderTemplate;
  shadowedFacts = new Set();
  // Full interleaved deck every recall loop — no retirement
  const ordered = fixedOrConstrained(deck.map(c => cloneCard(c, false)), shuffleOn);
  queue = ordered;
  queueIndex = 0;
  resetScroll();
  updatePhaseUI();
  renderQueue();
  const cur = queue[0];
  if (cur) beginPresentation(cur);
}

function showHandoff() {
  phase = 'handoff';
  updatePhaseUI();
  $('handoff').classList.add('show');
}

function hideHandoff() {
  $('handoff').classList.remove('show');
}

function beginRecallFromHandoff() {
  hideHandoff();
  sessionOrderTemplate = null;
  recallLoop = 1;
  startRecallLoop();
}

/** Jump straight into quiz from study (or cold start). */
function skipToQuiz() {
  hideHandoff();
  $('summary').classList.remove('show');
  sessionDone = false;
  sessionOrderTemplate = null;
  if (!deck.length) deck = buildDeck();
  recallLoop = 1;
  startRecallLoop();
  setHeard('🎙 quiz — say the blank');
}

function flashMiss() {
  const card = currentCard();
  const entry = card && cardEls.get(card.uid);
  if (entry) {
    entry.answerEl.classList.remove('miss');
    void entry.answerEl.offsetWidth;
    entry.answerEl.classList.add('miss');
    setTimeout(() => entry.answerEl.classList.remove('miss'), 500);
  }
  const h = $('heard');
  h.classList.add('miss');
  setTimeout(() => h.classList.remove('miss'), 500);
}

function onStudyComplete() {
  if (phase !== 'study') return;
  phase = 'handoff'; // lock out further study speech immediately
  finishPresentation(true);
  showHandoff();
}

/** One shadow per fact per loop — stops Actium (etc.) from coming back 4× */
let shadowedFacts = new Set();

function onMatch() {
  const card = currentCard();
  if (!card || card.matched || phase !== 'recall') return;
  card.matched = true;
  updateCurrentDom();
  finishPresentation(true);
  setHeard('✓ ' + card.answerDisplay + (card.answerUnit ? ' ' + card.answerUnit : ''));

  // Within-loop spacing: one reappearance max, and only for forward/reverse (not relations)
  const canShadow = !card.shadow
    && (card.type === 'forward' || card.type === 'reverse')
    && !shadowedFacts.has(card.factId);
  if (canShadow) {
    shadowedFacts.add(card.factId);
    const insertAt = Math.min(queueIndex + 1 + 5, queue.length);
    queue.splice(insertAt, 0, cloneCard(card, true));
  }
  advanceAfterRecallMatch();
}

function advanceAfterRecallMatch() {
  queueIndex++;
  while (queueIndex < queue.length && queue[queueIndex].matched) queueIndex++;

  if (queueIndex >= queue.length) {
    if (recallLoop >= totalLoops) {
      endSession();
      return;
    }
    recallLoop++;
    startRecallLoop();
    return;
  }
  beginPresentation(queue[queueIndex]);
  renderQueue();
}

function revealCurrent() {
  if (phase !== 'recall') return;
  const card = currentCard();
  if (!card || card.matched || sessionDone) return;
  card.revealed = true;
  if (presentation) presentation.revealed = true;
  queue.splice(queueIndex, 1);
  queue.push(card);
  queueIndex = queue.length - 1;
  renderQueue();
  setHeard('revealed — now speak it');
}

function endSession() {
  sessionDone = true;
  phase = 'done';
  hideHandoff();
  updatePhaseUI();
  dumpLatency();
  commitSrsGrades();
  showSummary();
}

function median(nums) {
  if (!nums.length) return null;
  const a = nums.slice().sort((x, y) => x - y);
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

function showSummary() {
  const matched = latencyLog.filter(r => r.tMatch != null);
  const revealedCount = latencyLog.filter(r => r.revealed).length;
  const groups = new Map();
  for (const r of matched) {
    const key = r.cardId + ' · ' + r.type;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r.tMatch - r.tCue);
  }
  let latencyRows = '';
  for (const [key, times] of groups) {
    const med = median(times);
    latencyRows += `<tr><td>${key}</td><td>${med != null ? Math.round(med) + ' ms' : '—'}</td><td>${times.length}</td></tr>`;
  }
  $('summaryMeta').textContent = `${revealedCount} revealed · ${matched.length} matched presentations`;
  $('summaryBody').innerHTML =
    `<div class="sec-h">Memory strength</div>` +
    `<table><thead><tr><th>fact</th><th>strength</th><th>next review</th></tr></thead>` +
    `<tbody>${masteryRows()}</tbody></table>` +
    (latencyRows
      ? `<div class="sec-h" style="margin-top:14px">This session's recall speed</div>` +
        `<table><thead><tr><th>card</th><th>median match</th><th>n</th></tr></thead>` +
        `<tbody>${latencyRows}</tbody></table>`
      : '');

  // Honest scheduler — replaces the old hardcoded "come back tomorrow"
  const sched = srsSchedule();
  const tEl = document.querySelector('#summary .tomorrow');
  if (tEl) {
    if (sched.dueNow > 0) {
      tEl.textContent = `${sched.dueNow} ${sched.dueNow === 1 ? 'fact is' : 'facts are'} still shaky — run another pass now, or come back soon.`;
    } else if (sched.nextDue) {
      tEl.textContent = `Next review: ${relDay(sched.nextDue, Date.now())}.`;
    } else {
      tEl.textContent = 'Come back tomorrow for one pass.';
    }
  }
  $('summary').classList.add('show');
}

function startSession() {
  sessionDone = false;
  hideHandoff();
  $('summary').classList.remove('show');
  latencyLog.length = 0;
  presentation = null;
  sessionOrderTemplate = null;
  studyWords = [];
  matchedIndex = 0;
  utterAnchor = 0;
  if (!TOPICS[topicId]) topicId = 'gpu';
  persistTopic();
  syncTopicNav();
  deck = buildDeck();
  startStudy();
}

// Study word-follow — tight window so STT can't leap ahead
const WIN = 4;
function advanceFrom(from, words) {
  let p = from;
  for (let wi = 0; wi < words.length; wi++) {
    const h = words[wi];
    // Whole-number shortcut: "989" already expanded upstream; if a digit slips
    // through, jump the matching spoken run in one step
    if (/^\d+$/.test(h)) {
      const next = tryConsumeSpokenNumber(p, parseInt(h, 10));
      if (next > p) { p = next; continue; }
    }
    const end = Math.min(studyWords.length, p + WIN);
    let hit = -1;
    for (let i = p; i < end; i++) if (studyWordMatch(studyWords[i].norm, h)) { hit = i; break; }
    if (hit < 0) continue;
    // Any skip farther than one word needs the next heard word to confirm
    if (hit - p > 1) {
      const nxt = words[wi + 1];
      const confirmed = nxt && studyWords[hit + 1] && studyWordMatch(studyWords[hit + 1].norm, nxt);
      if (!confirmed) continue;
    }
    p = hit + 1;
  }
  return p;
}

// ---------- voice ----------
let voiceOn = false, rec = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SPEECH_ID = 'ingrain';
let micStream = null;
let stream = null;

async function ensureMic() {
  if (micStream && micStream.active) return true;
  if (HubClient.embedded) {
    const m = HubClient.mic();
    if (m && m.active) { micStream = m; return true; }
    if (HubClient.micError()) {
      setHeard('hub mic unavailable: ' + HubClient.micError());
      return false;
    }
  }
  if (stream && stream.active && stream.getAudioTracks().length) {
    micStream = stream; return true;
  }
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); return true; }
  catch (e) {
    setHeard('🎙 mic unavailable: ' + (e.name || e));
    return false;
  }
}

function setHeard(msg, retry) {
  const el = $('heard');
  el.textContent = msg || '';
  el.classList.toggle('retry', !!retry);
}

function onSpeech(e) {
  if (sessionDone || phase === 'handoff' || phase === 'done') return;
  let finals = '', interim = '';
  for (let i = e.resultIndex; i < e.results.length; i++) {
    const r = e.results[i];
    if (r.isFinal) finals += r[0].transcript + ' '; else interim += r[0].transcript + ' ';
  }
  const text = (finals + ' ' + interim).trim();
  if (!text) return;
  noteSpeech();

  if (phase === 'study') {
    // Prose read-along — ignore bare digits; commit only on finals (interim can't race ahead)
    const fw = studySpeechTokens(finals);
    const iw = studySpeechTokens(interim);
    setHeard('🎙 ' + (fw.length || iw.length ? fw.concat(iw).slice(-7).join(' ') : studySpeechTokens(text).slice(-7).join(' ')));
    if (fw.length) {
      utterAnchor = advanceFrom(utterAnchor, fw);
      matchedIndex = utterAnchor;
      updateStudyWordStyles();
      snapToSpeechWord();
    } else if (iw.length) {
      // Peek at most one word ahead from committed anchor — no leaping on partials
      const peek = Math.min(advanceFrom(utterAnchor, iw), utterAnchor + 1);
      matchedIndex = Math.max(utterAnchor, peek);
      updateStudyWordStyles();
      snapToSpeechWord();
    }
    if (utterAnchor >= studyWords.length && studyWords.length) {
      onStudyComplete();
      return;
    }
    if (finals.trim() && presentation) presentation.attempts++;
    return;
  }

  if (phase === 'recall') {
    const card = currentCard();
    if (!card || card.matched) return;
    const heardBits = coalesceGpuTokens(normWords(text)).slice(-7).join(' ');
    setHeard('🎙 ' + heardBits);

    // Prefer finals for commit; also accept a strong interim so blanks fill promptly
    const tryFinal = finals.trim();
    const tryInterim = interim.trim();
    if (tryFinal && answerMatches(card, tryFinal)) {
      onMatch();
      return;
    }
    if (!tryFinal && tryInterim && answerMatches(card, tryInterim)) {
      onMatch();
      return;
    }
    // Wrong final guess — stay blank, flash red
    if (tryFinal) {
      if (presentation) presentation.attempts++;
      flashMiss();
      setHeard('✗ ' + heardBits + ' — try again');
    }
    return;
  }

  setHeard('🎙 ' + coalesceGpuTokens(normWords(text)).slice(-7).join(' '));
}

function killVoice(msg) {
  voiceOn = false;
  stopVoice();
  syncVoiceBtn();
  const canRetry = !HubClient.isElectron();
  if (msg) setHeard(msg + (canRetry ? ' · click to retry' : ''), canRetry);
}

async function startVoice() {
  if (!SR) { setHeard('no speech recognition — use Chrome'); voiceOn = false; syncVoiceBtn(); return; }
  if (HubClient.isElectron()) {
    voiceOn = false; syncVoiceBtn();
    setHeard(HubClient.speechHint());
    return;
  }
  if (HubClient.embedded && !HubClient.isActive()) return;
  if (document.visibilityState === 'hidden') return;
  stopVoice();
  if (!await ensureMic()) { voiceOn = false; syncVoiceBtn(); return; }
  if (!voiceOn) return;
  if (HubClient.embedded && !HubClient.isActive()) return;
  HubClient.claimSpeech(SPEECH_ID, () => { stopVoice(); });
  rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
  rec.onresult = onSpeech;
  rec.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    if (e.error === 'network') { killVoice(HubClient.speechHint()); return; }
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      killVoice('mic blocked — check permission'); return;
    }
    killVoice('speech error: ' + e.error);
  };
  rec.onend = () => {
    if (!voiceOn || !rec || document.visibilityState === 'hidden') return;
    if (HubClient.embedded && !HubClient.isActive()) return;
    try { rec.start(); } catch (e) {}
  };
  try { rec.start(); } catch (e) {}
  setHeard('🎙 listening…');
}

function stopVoice() {
  HubClient.releaseSpeech(SPEECH_ID);
  if (rec) {
    try { rec.onend = null; rec.onerror = null; rec.onresult = null; rec.stop(); } catch (e) {}
    rec = null;
  }
  setHeard('');
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rec) { try { rec.onend = null; rec.onerror = null; rec.onresult = null; rec.stop(); } catch (e) {} rec = null; }
    HubClient.releaseSpeech(SPEECH_ID);
  } else if (voiceOn && !rec && (!HubClient.embedded || HubClient.isActive())) {
    startVoice();
  }
});
$('heard').onclick = () => {
  if (!$('heard').classList.contains('retry')) return;
  voiceOn = true; syncVoiceBtn(); startVoice();
};

function syncVoiceBtn() {
  const b = $('voiceBtn');
  b.classList.toggle('primary', voiceOn);
  b.textContent = voiceOn ? '🎙 Voice on' : '🎙 Voice';
}
async function toggleVoice() {
  voiceOn = !voiceOn;
  if (voiceOn) await startVoice();
  else stopVoice();
  syncVoiceBtn();
}

HubClient.onActive(on => {
  if (!on) {
    if (rec) { try { rec.onend = null; rec.onerror = null; rec.onresult = null; rec.stop(); } catch (e) {} rec = null; }
    HubClient.releaseSpeech(SPEECH_ID);
  } else if (voiceOn) {
    startVoice();
  }
});

async function initCam() {
  const hubCam = HubClient.embedded && HubClient.camera(), hubMic = HubClient.embedded && HubClient.mic();
  if (hubCam && hubCam.active) {
    stream = new MediaStream([...hubCam.getVideoTracks(), ...(hubMic && hubMic.active ? hubMic.getAudioTracks() : [])]);
  } else {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: 'user' }, audio: true });
  }
  self.srcObject = stream; await self.play();
}

// ---------- wiring ----------
$('voiceBtn').onclick = toggleVoice;
$('revealBtn').onclick = revealCurrent;
$('resetBtn').onclick = () => startSession();
$('prevTopic').onclick = () => stepTopic(-1);
$('nextTopic').onclick = () => stepTopic(1);
$('topicTitle').onclick = (e) => {
  e.stopPropagation();
  const open = $('topicMenu').classList.contains('open');
  closeStepMenus();
  if (!open) {
    fillTopicMenu();
    $('topicMenu').classList.add('open');
    $('topicTitle').setAttribute('aria-expanded', 'true');
  }
};
addEventListener('click', (e) => {
  if (!$('topicNav').contains(e.target)) closeStepMenus();
});
$('beginRecallBtn').onclick = () => beginRecallFromHandoff();
$('skipQuizBtn').onclick = () => skipToQuiz();
$('skipHandoffBtn').onclick = () => {
  hideHandoff();
  endSession();
};
$('againBtn').onclick = () => startSession();
$('closeSummary').onclick = () => $('summary').classList.remove('show');

// ---------- topic editor ----------
let editingId = null;
function renderEdList() {
  const store = customStore();
  const ids = Object.keys(store);
  const el = $('edList');
  if (!ids.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="sec-h">Your topics — click to edit</div>';
  ids.forEach(id => {
    const b = document.createElement('button');
    b.className = 'btn edchip';
    b.textContent = store[id].title || id;
    b.onclick = () => openEditor(id);
    el.appendChild(b);
  });
}
function openEditor(id) {
  editingId = id || null;
  const t = id ? customStore()[id] : null;
  $('editorTitle').textContent = t ? 'Edit topic' : 'New topic';
  $('edTitle').value = t ? (t.title || '') : '';
  $('edPairs').value = t ? t.facts.map(f => `${f.prompt} = ${f.answer}`).join('\n') : '';
  $('edDelete').style.display = t ? '' : 'none';
  renderEdList();
  $('editor').classList.add('show');
  $('edTitle').focus();
}
function closeEditor() { $('editor').classList.remove('show'); editingId = null; }
function saveEditor() {
  const title = $('edTitle').value.trim() || 'Untitled';
  const facts = parsePairsInput($('edPairs').value);
  if (!facts.length) { $('edPairs').focus(); setHeard('add at least one "prompt = answer" line'); return; }
  const store = customStore();
  const id = editingId || ('u' + Date.now().toString(36));
  store[id] = { id, title, kind: 'pairs', facts };
  saveCustomStore(store);
  loadCustomTopics();
  closeEditor();
  topicId = id;
  persistTopic();
  startSession();
}
function deleteEditor() {
  if (!editingId) return;
  const store = customStore();
  delete store[editingId];
  saveCustomStore(store);
  const wasCurrent = topicId === editingId;
  loadCustomTopics();
  closeEditor();
  if (wasCurrent) { topicId = 'gpu'; persistTopic(); }
  startSession();
}
$('edSave').onclick = saveEditor;
$('edCancel').onclick = closeEditor;
$('edDelete').onclick = deleteEditor;

addEventListener('keydown', (e) => {
  if ($('editor').classList.contains('show')) {
    if (e.key === 'Escape') closeEditor();
    else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveEditor(); }
    return; // don't fire study/quiz shortcuts while authoring
  }
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === 'Escape' && $('topicMenu').classList.contains('open')) {
    closeStepMenus();
    return;
  }
  if ($('summary').classList.contains('show')) {
    if (e.key === 'Escape') $('summary').classList.remove('show');
    return;
  }
  if ($('handoff').classList.contains('show')) {
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      beginRecallFromHandoff();
    }
    if (e.key === 'Escape') {
      hideHandoff();
      endSession();
    }
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (phase === 'recall') revealCurrent();
  }
  if (e.key.toLowerCase() === 'v') toggleVoice();
  if (e.key.toLowerCase() === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if ((e.key === '[' || e.key === ']') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    stepTopic(e.key === '[' ? -1 : 1);
  }
});

// ---------- boot ----------
(async () => {
  try { await initCam(); } catch (err) { alert('Camera/mic needed.\n' + err.message); }
  startSession();
  if (SR && !HubClient.isElectron()) {
    voiceOn = true;
    if (!HubClient.embedded || HubClient.isActive()) await startVoice();
  } else {
    voiceOn = false;
    setHeard(HubClient.isElectron() ? HubClient.speechHint() : 'no speech recognition — use Chrome');
  }
  syncVoiceBtn();
})();
</script>
