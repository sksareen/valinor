<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>Learn — speak to remember</title>
<style>
  :root, html[data-theme="dark"] {
    --bg: #05060a; --bg-elev: #0b0d14; --ink: #e2e8f0; --mute: #64748b; --accent: #7dd3fc;
  }
  html[data-theme="light"] {
    --bg: #f8fafc; --bg-elev: #ffffff; --ink: #0f172a; --mute: #64748b; --accent: #0284c7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: Lato, sans-serif; color: var(--ink); }
  #self { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); background: var(--bg); }
  .scrim { position: fixed; inset: 0; background: rgba(5,6,10,.42); pointer-events: none; }

  #prompter { position: fixed; top: 0; bottom: 120px; left: 50%; transform: translateX(-50%);
    width: min(1100px, 88vw); overflow: hidden; text-align: center; overscroll-behavior: contain; }
  #scroll { font-weight: 650; line-height: 1.42; letter-spacing: -0.01em; will-change: transform;
    color: #f8fafc; text-shadow: 0 2px 18px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.7); }
  #scroll .card { margin: 1.1em 0; opacity: .38; transition: opacity .18s; }
  #scroll .card.cur { opacity: 1; }
  #scroll .card.done { opacity: .45; }
  #scroll .cue { color: var(--accent); font-size: .72em; opacity: .9; margin-bottom: .15em; }
  #scroll .note { color: #94a3b8; font-size: .55em; font-weight: 500; margin-top: .2em;
    max-width: 36em; margin-left: auto; margin-right: auto; }
  #scroll .answer { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  #scroll .answer.masked { color: #64748b; letter-spacing: .18em; }
  #scroll .answer.revealed { color: #fbbf24; }
  #scroll .answer.matched { color: #34d399; }
  #scroll .answer.miss { color: #f87171; animation: missPulse .45s ease; }
  @keyframes missPulse { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  #heard.miss { color: #f87171; }
  #scroll .w { transition: color .12s, opacity .12s; }
  #scroll .w.done { color: #64748b; opacity: .5; }
  #scroll .w.cur { color: var(--accent); text-shadow: 0 0 20px rgba(125,211,252,.55); }
  /* Study: connected prose, not quiz cards */
  #scroll .study-prose { text-align: left; max-width: 34em; margin: 0 auto; }
  #scroll .study-line { margin: 0.9em 0; line-height: 1.55; font-weight: 600; }
  #scroll .study-lead { color: var(--accent); font-size: .72em; letter-spacing: .04em;
    margin-bottom: 1.1em; opacity: .9; }
  #scroll .study-num { color: var(--accent); font-variant-numeric: tabular-nums;
    font-weight: 700; opacity: .85; } /* visual digits — not spoken */

  /* Left vertical timeline — large, vertically centered */
  #timeline {
    position: fixed; left: 28px; top: 0; bottom: 110px; width: 260px;
    z-index: 4; display: none; flex-direction: column; justify-content: center;
    overflow: hidden; padding: 0 8px; pointer-events: none;
  }
  #timeline.show { display: flex; }
  #timeline .tl-title {
    font: 700 12px Lato, sans-serif; letter-spacing: .18em; color: var(--accent);
    opacity: .8; margin: 0 0 18px 32px; text-transform: uppercase; flex-shrink: 0;
  }
  #timeline .tl-rail {
    position: relative; padding-left: 32px; max-height: min(72vh, 640px); overflow-y: auto;
  }
  #timeline .tl-rail::before {
    content: ''; position: absolute; left: 10px; top: 6px; bottom: 6px; width: 3px;
    background: linear-gradient(to bottom, rgba(125,211,252,.12), rgba(125,211,252,.55), rgba(125,211,252,.12));
  }
  #timeline .tl-node {
    position: relative; margin: 0 0 22px; padding: 0 0 0 6px;
    opacity: .4; transition: opacity .2s, color .2s;
  }
  #timeline .tl-node:last-child { margin-bottom: 0; }
  #timeline .tl-node::before {
    content: ''; position: absolute; left: -28px; top: 6px; width: 14px; height: 14px;
    border-radius: 50%; background: #1e293b; border: 2px solid rgba(125,211,252,.4);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }
  #timeline .tl-node.done { opacity: .75; }
  #timeline .tl-node.done::before { background: rgba(125,211,252,.55); border-color: var(--accent); }
  #timeline .tl-node.cur { opacity: 1; }
  #timeline .tl-node.cur::before {
    background: var(--accent); border-color: #fff;
    box-shadow: 0 0 16px rgba(125,211,252,.75);
  }
  #timeline .tl-year {
    font: 700 17px/1.2 Lato, sans-serif; font-variant-numeric: tabular-nums;
    color: #94a3b8;
  }
  #timeline .tl-node.cur .tl-year { color: var(--accent); }
  #timeline .tl-label {
    font: 600 16px/1.3 Lato, sans-serif; color: #e2e8f0; margin-top: 3px;
    text-shadow: 0 1px 10px rgba(0,0,0,.85);
  }
  body.timeline-on #prompter {
    left: calc(50% + 110px);
    width: min(900px, calc(88vw - 260px));
  }
  @media (max-width: 960px) {
    #timeline { display: none !important; }
    body.timeline-on #prompter { left: 50%; width: min(1100px, 88vw); }
  }

  #lensline { position: fixed; top: calc(var(--hub-pad-top, 44px) + 8px); left: 50%; transform: translateX(-50%);
    color: var(--accent); font: 600 11px Lato, sans-serif; letter-spacing: .18em; opacity: .7; }

  #bar { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: rgba(8,10,18,.7); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 999px; z-index: 5; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: #e2e8f0;
    font: 600 13px Lato, sans-serif; cursor: pointer; white-space: nowrap; transition: .12s; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn.primary { background: var(--accent); color: #05060a; border-color: transparent; }
  .sep { width: 1px; height: 24px; background: rgba(255,255,255,.12); }

  /* stepper — prev/next + title that opens a jump list */
  .stepNav { position: relative; display: flex; align-items: center; gap: 2px; }
  .stepNav .step { width: 32px; height: 34px; padding: 0; justify-content: center;
    border-radius: 999px; font-size: 16px; line-height: 1; color: #94a3b8; }
  .stepNav .step:hover { color: #e2e8f0; }
  .stepNav .stepTitle { min-width: 88px; max-width: 180px; justify-content: center;
    overflow: hidden; text-overflow: ellipsis; }
  .stepMenu { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
    min-width: 180px; max-height: 50vh; overflow-y: auto; padding: 6px;
    background: rgba(8,10,18,.92); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.1); border-radius: 14px; display: none; z-index: 6; }
  .stepMenu.open { display: block; }
  .stepMenu button { display: block; width: 100%; text-align: left; padding: 8px 12px;
    border: 0; border-radius: 8px; background: transparent; color: #cbd5e1;
    font: 600 13px Lato, sans-serif; cursor: pointer; white-space: nowrap; }
  .stepMenu button:hover { background: rgba(255,255,255,.08); color: #f8fafc; }
  .stepMenu button.active { color: var(--accent); background: rgba(125,211,252,.1); }
  #heard { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    font: 600 12px Lato, sans-serif; color: #64748b; z-index: 5; opacity: .85;
    max-width: 70vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #heard.retry { color: #fbbf24; cursor: pointer; text-decoration: underline; opacity: 1; }

  .panel { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: rgba(5,6,10,.92); backdrop-filter: blur(8px); }
  .panel.show { display: flex; }
  .panel h2 { font-size: 22px; font-weight: 700; }
  .panel .sub { color: #94a3b8; font: 500 14px/1.5 Lato, sans-serif; max-width: 28em; text-align: center; }
  .panel .tomorrow { color: var(--accent); font: 600 16px Lato, sans-serif; margin-top: 8px; }
  #summaryBody { width: min(520px, 90vw); max-height: 42vh; overflow: auto; text-align: left;
    font: 500 13px/1.55 Lato, sans-serif; color: #cbd5e1; }
  #summaryBody table { width: 100%; border-collapse: collapse; }
  #summaryBody th, #summaryBody td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.06); }
  #summaryBody th { color: #64748b; font-weight: 600; text-align: left; }
  #summaryBody .sec-h { color:#64748b; font:700 11px Lato,sans-serif; letter-spacing:.14em;
    text-transform:uppercase; margin:0 0 6px; }
  #summaryBody td.pips { color: var(--accent); letter-spacing:2px; }
  .row { display: flex; gap: 10px; }

  #editor #edTitle, #editor #edPairs {
    width: min(560px, 90vw); background: rgba(255,255,255,.06); color: #e2e8f0;
    border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 10px 12px;
    font: 500 14px/1.5 Lato, sans-serif; }
  #editor #edPairs { height: 34vh; resize: vertical; white-space: pre; overflow: auto; }
  #editor .sub b { color: var(--accent); }
  #edList { width: min(560px, 90vw); display: flex; flex-wrap: wrap; gap: 6px; }
  #edList .sec-h { width: 100%; color:#64748b; font:700 11px Lato,sans-serif;
    letter-spacing:.14em; text-transform:uppercase; margin: 2px 0; }
  #edList .edchip { padding: 6px 12px; font-size: 12px; }
</style>
</head>
<body>
  <video id="self" autoplay playsinline muted></video>
  <div class="scrim"></div>

  <div id="lensline">▲ STUDY — SPEAK IT IN</div>
  <aside id="timeline" aria-label="Timeline">
    <div class="tl-title">Timeline</div>
    <div class="tl-rail" id="timelineRail"></div>
  </aside>
  <div id="prompter"><div id="scroll"></div></div>
  <div id="heard"></div>

  <div id="bar">
    <button class="btn" id="voiceBtn">🎙 Voice</button>
    <button class="btn" id="revealBtn" style="display:none">Reveal</button>
    <button class="btn" id="skipQuizBtn">Skip to quiz</button>
    <button class="btn" id="resetBtn">Reset</button>
    <div class="sep"></div>
    <div class="stepNav" id="topicNav">
      <button class="btn step" id="prevTopic" title="Previous topic" aria-label="Previous topic">‹</button>
      <button class="btn stepTitle" id="topicTitle" title="Jump to topic" aria-haspopup="listbox" aria-expanded="false"></button>
      <button class="btn step" id="nextTopic" title="Next topic" aria-label="Next topic">›</button>
      <div class="stepMenu" id="topicMenu" role="listbox"></div>
    </div>
  </div>

  <div class="panel" id="handoff">
    <h2>Map loaded</h2>
    <div class="sub">Now recall — answers hidden. Speak what you remember.</div>
    <div class="row">
      <button class="btn primary" id="beginRecallBtn">Begin recall</button>
      <button class="btn" id="skipHandoffBtn">Done for now</button>
    </div>
  </div>

  <div class="panel" id="summary">
    <h2>Session done</h2>
    <div id="summaryMeta" class="sub"></div>
    <div id="summaryBody"></div>
    <div class="tomorrow">Come back tomorrow for one pass.</div>
    <div class="row"><button class="btn primary" id="againBtn">Again</button><button class="btn" id="closeSummary">Close</button></div>
  </div>

  <div class="panel" id="editor">
    <h2 id="editorTitle">New topic</h2>
    <div class="sub">One pair per line — <b>prompt = answer</b>. Keep answers short and speakable (1–4 words) so voice recall can match them.</div>
    <input id="edTitle" placeholder="Topic name (e.g. Spanish verbs)" autocomplete="off" />
    <textarea id="edPairs" spellcheck="false"
      placeholder="Capital of France = Paris&#10;Mitochondria = powerhouse of the cell&#10;to run (Spanish) = correr"></textarea>
    <div id="edList"></div>
    <div class="row">
      <button class="btn primary" id="edSave">Save &amp; study</button>
      <button class="btn" id="edDelete" style="display:none">Delete</button>
      <button class="btn" id="edCancel">Cancel</button>
    </div>
  </div>

<script src="hub-client.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const self = $('self'), scrollEl = $('scroll'), prompter = $('prompter');
HubClient.forwardNavKeys();

// ---------- 1. Topics (each keeps its own FACTS + study prose) ----------
const LANDMARK_CARDS = false;

const TOPICS = {
  gpu: {
    id: 'gpu',
    title: 'NVIDIA FLOPs',
    kind: 'flops',
    facts: [
      { id: 'v100', chip: 'V100', arch: 'Volta', year: 2017, tflops: 125, spoken: 'one hundred twenty-five', landmark: null, note: null },
      { id: 'a100', chip: 'A100', arch: 'Ampere', year: 2020, tflops: 312, spoken: 'three hundred twelve', landmark: null, note: null },
      { id: 'h100', chip: 'H100', arch: 'Hopper', year: 2022, tflops: 989, spoken: 'nine hundred eighty-nine', landmark: 'just under one petaflop', note: null },
      { id: 'h200', chip: 'H200', arch: 'Hopper', year: 2023, tflops: 989, spoken: 'nine hundred eighty-nine', landmark: 'same compute as H100',
        note: 'Same compute class as H100 — the difference is memory: 141GB HBM3e vs 80GB.' },
      { id: 'b200', chip: 'B200', arch: 'Blackwell', year: 2024, tflops: 2250, spoken: 'two thousand two hundred fifty', landmark: null, note: null },
      { id: 'rubin', chip: 'Rubin', arch: 'Rubin', year: 2026, tflops: 4000, spoken: 'four thousand', landmark: null,
        note: 'NVIDIA’s next architecture after Blackwell (ships 2H 2026). Dense FP16 figure is preliminary — NVIDIA quotes Rubin mostly in FP4.' },
    ],
  },
  rome: {
    id: 'rome',
    title: 'Rome: Republic → Empire',
    kind: 'dates',
    // Chronology: First Triumvirate → Caesar’s civil war → Second Triumvirate → Augustus → his death
    facts: [
      {
        id: 'first-triumvirate',
        label: 'First Triumvirate',
        context: 'Caesar, Pompey, Crassus',
        year: 60, era: 'BCE', spoken: 'sixty',
        note: null,
        study: 'In sixty (60) BCE, Caesar, Pompey, and Crassus form the First Triumvirate.',
      },
      {
        id: 'carrhae',
        label: 'Carrhae',
        context: 'Crassus killed; the alliance breaks',
        year: 53, era: 'BCE', spoken: 'fifty three',
        note: 'With Crassus dead in Parthia, nothing balances Caesar and Pompey — the drift to civil war begins.',
        study: 'In fifty three (53) BCE, Crassus is killed at Carrhae, and the First Triumvirate breaks.',
      },
      {
        id: 'rubicon',
        label: 'Rubicon',
        context: 'Caesar’s civil war begins',
        year: 49, era: 'BCE', spoken: 'forty nine',
        note: null,
        study: 'In forty nine (49) BCE, Caesar crosses the Rubicon and the civil war begins.',
      },
      {
        id: 'pharsalus',
        label: 'Pharsalus',
        context: 'Caesar defeats Pompey',
        year: 48, era: 'BCE', spoken: 'forty eight',
        note: null,
        study: 'In forty eight (48) BCE, Caesar defeats Pompey at Pharsalus.',
      },
      {
        id: 'ides',
        label: 'Ides of March',
        context: 'Caesar assassinated',
        year: 44, era: 'BCE', spoken: 'forty four',
        note: null,
        study: 'In forty four (44) BCE, on the Ides of March, Caesar is assassinated.',
      },
      {
        id: 'second-triumvirate',
        label: 'Second Triumvirate',
        context: 'Octavian, Antony, Lepidus',
        year: 43, era: 'BCE', spoken: 'forty three',
        note: null,
        study: 'In forty three (43) BCE, Octavian, Antony, and Lepidus form the Second Triumvirate.',
      },
      {
        id: 'philippi',
        label: 'Philippi',
        context: 'Brutus and Cassius defeated',
        year: 42, era: 'BCE', spoken: 'forty two',
        note: null,
        study: 'In forty two (42) BCE, the Second Triumvirate defeats Brutus and Cassius at Philippi.',
      },
      {
        id: 'actium',
        label: 'Actium',
        context: 'Octavian defeats Antony and Cleopatra',
        year: 31, era: 'BCE', spoken: 'thirty one',
        note: null,
        study: 'In thirty one (31) BCE, Octavian defeats Antony and Cleopatra at Actium.',
      },
      {
        id: 'augustus',
        label: 'Augustus',
        context: 'Principate begins',
        year: 27, era: 'BCE', spoken: 'twenty seven',
        note: 'Octavian receives the title Augustus — the Republic’s form remains, but one man holds the power.',
        study: 'In twenty seven (27) BCE, Octavian becomes Augustus and the Principate begins.',
      },
      {
        id: 'augustus-death',
        label: 'Death of Augustus',
        context: 'End of his reign',
        year: 14, era: 'CE', spoken: 'fourteen',
        note: null,
        study: 'In fourteen (14) CE, Augustus dies — the end of his reign, and the Empire endures.',
      },
    ],
  },

  training: {
    id: 'training',
    title: 'Training — Part 1',
    kind: 'pairs',
    studyLead: 'Part one — how a model learns. From the loss function to fine-tuning: the loop that shapes the weights. Read each idea, then say the answer aloud.',
    facts: [
      { id: 'loss', term: 'Loss function',
        prompt: 'What does the loss function measure', answer: 'how wrong the model is',
        study: 'Training begins with a loss function — one number that measures how wrong the model’s predictions are. Lower loss, better model. Everything in training exists to push that number down.' },
      { id: 'gradient', term: 'Gradient',
        prompt: 'What does the gradient tell you', answer: 'the uphill direction of loss',
        study: 'The gradient is the slope of the loss with respect to every weight — it points the way that increases loss fastest. To cut loss, you go the opposite way: downhill.' },
      { id: 'gradient-descent', term: 'Gradient descent',
        prompt: 'What is gradient descent', answer: 'step the weights downhill',
        study: 'Gradient descent is the core algorithm: compute the gradient, then nudge every weight a small step opposite it. Repeat millions of times and the model rolls downhill toward lower loss.',
        note: 'The loss “surface” is a landscape with one dimension per weight — millions of them. You’re finding the low points of an unimaginably high-dimensional valley.' },
      { id: 'learning-rate', term: 'Learning rate',
        prompt: 'What does the learning rate control', answer: 'the size of each step',
        study: 'The learning rate sets how big each downhill step is. Too large and you overshoot the valley and diverge; too small and training crawls. It is the single most important knob.',
        note: 'Large-model pretraining typically peaks around 1e-4 to 3e-4, with a short warmup then a cosine decay toward zero.' },
      { id: 'backprop', term: 'Backpropagation',
        prompt: 'How are gradients computed through a deep network', answer: 'backpropagation',
        study: 'Backpropagation computes those gradients efficiently: run the input forward to get the loss, then apply the chain rule backward through every layer, so each weight learns how much it caused the error.' },
      { id: 'fwd-bwd', term: 'Forward + backward pass',
        prompt: 'The two passes in one training step are', answer: 'forward and backward',
        study: 'Every training step is two passes: the forward pass computes predictions and loss; the backward pass computes gradients. Then the optimizer updates the weights. Forward, backward, update — that is one step.' },
      { id: 'sgd', term: 'Stochastic gradient descent',
        prompt: 'Why train on a mini-batch instead of the whole dataset', answer: 'a cheap gradient estimate',
        study: 'Computing the exact gradient over the whole dataset each step is far too expensive. Stochastic gradient descent estimates it from a random mini-batch — noisier, but far faster, and the noise even helps escape bad spots. LLM pretraining batches are huge, millions of tokens per step.' },
      { id: 'optimizer', term: 'Optimizer (Adam)',
        prompt: 'What does an optimizer like Adam add over plain SGD', answer: 'momentum and adaptive step sizes',
        study: 'Optimizers like Adam improve on raw descent: momentum carries velocity through flat stretches, and per-weight adaptive rates let each weight take an appropriately sized step. AdamW, the weight-decay variant, is the LLM default — its two moment estimates add about 8 bytes per parameter of memory.' },
      { id: 'hill-climbing', term: 'Hill climbing',
        prompt: 'How does hill climbing differ from gradient descent', answer: 'trial and error, no gradient',
        study: 'Hill climbing is the simpler cousin: from where you are, try a nearby change and keep it only if the score improves. No gradient, no derivative — just local trial and error. Gradient descent beats it whenever you can compute a gradient, because the gradient tells you which way to move instead of guessing.',
        note: 'Both are local search, and both can get stuck in a local optimum — a spot better than all its neighbors but not the global best.' },
      { id: 'local-minima', term: 'Local minima & saddles',
        prompt: 'What is a local minimum', answer: 'a low point that isn’t the global best',
        study: 'The loss landscape has local minima — valleys lower than everything nearby but not the deepest — and saddle points that only look flat. In very high dimensions most traps are saddles, which momentum and noise can slip past.' },
      { id: 'epoch', term: 'Epoch / step',
        prompt: 'What is one epoch', answer: 'one full pass over the data',
        study: 'An epoch is one complete pass through the training set. Frontier models train over enormous corpora measured in tokens seen — Llama 3 saw about 15 trillion — often for only a fraction of an epoch.' },
      { id: 'overfitting', term: 'Overfitting',
        prompt: 'What is overfitting', answer: 'memorizing instead of generalizing',
        study: 'Overfitting is memorizing the training data — low training loss, poor results on new inputs. The goal is generalization: patterns that transfer. Held-out validation loss is how you catch it.' },
      { id: 'pretrain-finetune', term: 'Pretrain vs fine-tune',
        prompt: 'Pretraining versus fine-tuning', answer: 'learn broadly, then specialize',
        study: 'Pretraining learns broad language and world patterns from massive unlabeled text — the expensive part. Fine-tuning then specializes that base model on a smaller targeted set. Most capability comes from pretraining; most behavior-shaping from fine-tuning.' },
    ],
  },

  inference: {
    id: 'inference',
    title: 'Inference — Part 2',
    kind: 'pairs',
    studyLead: 'Part two — how a trained model runs. First the tokens and attention it’s built on, then the latency and throughput of serving it. Read each idea, then say the answer aloud.',
    facts: [
      { id: 'token', section: 'The model — tokens and the transformer.', term: 'Token',
        prompt: 'What is a token', answer: 'a sub-word chunk of text',
        study: 'Models don’t see characters or words — they see tokens: sub-word chunks of very roughly four characters, about three-quarters of a word each, so 1,000 tokens is around 750 words. Context length, throughput, and cost are all counted in tokens.' },
      { id: 'parameters', term: 'Parameters',
        prompt: 'What are a model’s parameters', answer: 'the learned weights',
        study: 'Parameters are the learned weights — the billions of numbers adjusted by gradient descent. “A seventy-billion-parameter model” means seventy billion of these knobs; at two bytes each in BF16, that’s about 140 GB of weights. At inference they’re frozen.' },
      { id: 'autoregressive', term: 'Autoregressive generation',
        prompt: 'How does a language model generate text', answer: 'one token at a time',
        study: 'Generation is autoregressive: the model predicts the next token from everything so far, appends it, and feeds the whole sequence back to predict the next. Left to right, one token at a time — which is why output length costs time.' },
      { id: 'logits', term: 'Logits, softmax, sampling',
        prompt: 'What turns raw model outputs into a next-token choice', answer: 'softmax then sampling',
        study: 'The model emits a logit — a raw score — for every token in its vocabulary. Softmax turns those into probabilities and a sampler picks one; temperature and top-p control how adventurous that pick is.' },
      { id: 'attention', term: 'Attention',
        prompt: 'What does attention let each token do', answer: 'weigh every earlier token',
        study: 'Attention is the transformer’s core: for each token it computes how much to attend to every previous token, mixing their information. Each token’s keys and values are exactly what gets cached at inference.' },

      { id: 'inference', section: 'Serving — latency and throughput.', term: 'Inference',
        prompt: 'What is inference', answer: 'a forward pass, weights frozen',
        study: 'Inference is using the trained model: a forward pass only — no backward pass, no weight updates. You feed a prompt in and read tokens out. Serving is the engineering of doing this fast, for many users at once.' },
      { id: 'prefill-decode', term: 'Prefill & decode',
        prompt: 'The two phases of an inference request are', answer: 'prefill and decode',
        study: 'An inference request has two phases. Prefill processes the whole prompt in parallel to produce the first token. Decode then generates the rest one token at a time. Their performance profiles are completely different.' },
      { id: 'ttft', term: 'Time to first token',
        prompt: 'What does time to first token, TTFT, measure', answer: 'latency to the first token',
        study: 'Time to first token, TTFT, is how long from request until the first token appears. It’s dominated by prefill — the model chewing through your prompt — so a longer prompt means a longer TTFT. It’s the “is it alive?” latency.' },
      { id: 'itl', term: 'Inter-token latency',
        prompt: 'What is inter-token latency, the time per output token', answer: 'the gap between later tokens',
        study: 'After the first token, inter-token latency — also called time per output token — is the gap between each following token in the decode phase, typically ten to fifty milliseconds, i.e. twenty to a hundred tokens per second. Its inverse is that tokens-per-second rate, the speed you watch text stream.',
        note: 'This is the “time to next token”: TTFT is the first token, inter-token latency is every one after. Total latency ≈ TTFT + inter-token latency × output length.' },
      { id: 'kv-cache', term: 'KV cache',
        prompt: 'What does the KV cache do', answer: 'stores past keys and values',
        study: 'The KV cache is the trick behind fast decode: rather than re-reading the whole sequence for each new token, the model caches every token’s attention keys and values. Decode then does constant work per token — but the cache grows with context, eating memory.' },
      { id: 'decode-bound', term: 'Compute- vs memory-bound',
        prompt: 'Prefill is compute-bound; decode is bound by what', answer: 'memory bandwidth',
        study: 'Prefill is compute-bound — heavy parallel math over the whole prompt. Decode is memory-bandwidth-bound: for each single token it must stream all the weights and the KV cache out of memory. Decode speed tracks memory bandwidth, not raw FLOPS.',
        note: 'This is why the H200 — same FLOPS as the H100 but more and faster memory — speeds up inference. It ties straight back to the NVIDIA topic.' },
      { id: 'batching', term: 'Throughput & batching',
        prompt: 'How do you raise throughput without more hardware', answer: 'batch requests together',
        study: 'Latency is one user’s speed; throughput is total tokens per second across everyone. Batching many requests into one forward pass reuses each weight-load across users; continuous batching swaps requests in and out as they finish. Bigger batches lift throughput but can raise each user’s latency.' },
      { id: 'quantization', term: 'Quantization',
        prompt: 'What does quantization trade for speed and memory', answer: 'numerical precision',
        study: 'Quantization stores weights and activations in fewer bits — FP16 to FP8 to FP4 — shrinking memory and multiplying math throughput at some cost in precision. Because decode is memory-bound, smaller weights often mean directly faster inference. It’s the same precision ladder as the NVIDIA topic.' },
      { id: 'speculative', term: 'Speculative decoding',
        prompt: 'How does speculative decoding speed up generation', answer: 'draft small, verify big',
        study: 'Speculative decoding attacks the one-token-at-a-time bottleneck: a small fast model drafts several tokens ahead, and the large model verifies them in a single parallel pass, keeping the ones it agrees with. When the draft is good, you get several tokens for the cost of one — often a two-to-three-times speedup.' },
      { id: 'context-length', term: 'Context length',
        prompt: 'What is the context length, the context window', answer: 'max tokens it can attend to',
        study: 'Context length is how many tokens — prompt plus generation — the model can hold at once; modern models span 128,000 to over a million. Longer context means a bigger KV cache and slower, memory-hungrier inference, which is why very long contexts get expensive.' },
    ],
  },

  parallelism: {
    id: 'parallelism',
    title: 'Distributed training',
    kind: 'pairs',
    studyLead: 'How you train a model too big for one chip: split the work across thousands of them. The strategies, the memory tricks, the communication, and the efficiency. Read each idea, then say the answer aloud.',
    facts: [
      { id: 'data-parallel', section: 'Ways to split the work.', term: 'Data parallelism',
        prompt: 'What does data parallelism split', answer: 'the batch, not the model',
        study: 'Data parallelism replicates the whole model on every device and splits the batch between them. Each replica computes gradients on its shard, then an all-reduce averages them so every copy stays in sync. It scales throughput, not model size — every device still holds the full model.' },
      { id: 'tensor-parallel', term: 'Tensor parallelism',
        prompt: 'What does tensor, or intra-layer, parallelism split', answer: 'individual weight matrices',
        study: 'Tensor parallelism splits a single layer’s weight matrices across devices — each computes part of the matmul, and the results are all-reduced within the layer. It cuts per-device memory and compute, but the constant communication demands the fastest interconnect, so it usually stays inside one node over NVLink, typically 8-way to match the GPUs in a server.' },
      { id: 'pipeline-parallel', term: 'Pipeline parallelism',
        prompt: 'What does pipeline parallelism split', answer: 'the layers into stages',
        study: 'Pipeline parallelism puts different layers on different devices as sequential stages, and micro-batches flow through like an assembly line. It’s communication-light — only activations cross between stages — but filling and draining the pipeline creates idle “bubbles.”',
        note: 'The bubble fraction is roughly (stages − 1) / micro-batches — so more micro-batches shrink it, and the pipeline spends a larger fraction of its time full.' },
      { id: 'expert-parallel', term: 'Expert parallelism (MoE)',
        prompt: 'In a Mixture-of-Experts, what does expert parallelism split', answer: 'the experts across devices',
        study: 'In a Mixture-of-Experts model each token is routed to a few expert feed-forward networks out of many — Mixtral fires 2 of 8, and models like DeepSeek and GPT-4 are widely believed to be MoE. Expert parallelism places different experts on different devices; an all-to-all shuffles tokens to their experts and back. Only a fraction of the parameters activate per token — more capacity for the same compute.' },
      { id: 'sequence-parallel', term: 'Sequence / context parallelism',
        prompt: 'What does sequence, or context, parallelism split', answer: 'the sequence dimension',
        study: 'Sequence or context parallelism splits the token dimension across devices, so no single one holds the whole sequence’s activations. It’s what makes very long context lengths trainable, at the cost of extra communication in attention.' },
      { id: 'three-d-parallel', term: '3D parallelism',
        prompt: 'What is 3D parallelism', answer: 'combining data, tensor, and pipeline',
        study: 'Real frontier runs combine all three: tensor parallelism inside a node over NVLink, pipeline parallelism across nodes, and data parallelism across the resulting replicas. Choosing the split — the parallelism mesh — to match the interconnect topology is the core systems problem.' },

      { id: 'zero-fsdp', section: 'Fitting it in memory.', term: 'ZeRO / FSDP',
        prompt: 'What do ZeRO and FSDP shard across data-parallel ranks', answer: 'optimizer states, gradients, and params',
        study: 'Plain data parallelism wastes memory — every replica stores a full copy of the optimizer states, gradients, and parameters. ZeRO, and PyTorch’s FSDP, shard those across the data-parallel ranks and gather each piece only when needed, cutting memory roughly by the number of ranks.',
        note: 'ZeRO stage 1 shards optimizer states, stage 2 adds gradients, stage 3 adds the parameters themselves.' },
      { id: 'activation-checkpoint', term: 'Activation checkpointing',
        prompt: 'What does activation checkpointing trade', answer: 'compute for memory',
        study: 'Activations saved during the forward pass dominate training memory. Activation checkpointing, or recomputation, throws most of them away and recomputes them in the backward pass — spending extra compute to fit a bigger model or batch in memory.' },
      { id: 'grad-accum', term: 'Gradient accumulation',
        prompt: 'What does gradient accumulation let you emulate', answer: 'a larger batch size',
        study: 'Gradient accumulation runs several micro-batches and sums their gradients before a single weight update. It emulates a large batch on limited memory — the same math, spread over more steps.' },
      { id: 'optimizer-memory', term: 'Optimizer memory',
        prompt: 'Why does Adam roughly triple the memory of the weights', answer: 'it stores two moments per weight',
        study: 'Adam keeps a running mean and variance for every parameter, so optimizer state is two extra copies of the weights — on top of the gradients and, in mixed precision, a master FP32 copy, about 16 bytes per parameter all told. That memory bloat is exactly why optimizer-state sharding matters so much.' },

      { id: 'all-reduce', section: 'The communication.', term: 'All-reduce',
        prompt: 'What collective sums the gradients so every device gets the result', answer: 'all-reduce',
        study: 'All-reduce is the workhorse: it sums a tensor — the gradients — across every device and hands the result back to all of them. It’s the synchronization step of data-parallel training, and often the scaling bottleneck.' },
      { id: 'collectives', term: 'Collective operations',
        prompt: 'Name the core collective operations', answer: 'all-reduce, all-gather, reduce-scatter, all-to-all',
        study: 'The building blocks are collectives: all-reduce sums to all, all-gather collects shards to all, reduce-scatter sums and splits, broadcast copies out, and all-to-all reshuffles. FSDP is built from all-gather and reduce-scatter; MoE routing is an all-to-all.' },
      { id: 'ring-allreduce', term: 'Ring all-reduce',
        prompt: 'Why is ring all-reduce bandwidth-optimal', answer: 'each device only sends its share around the ring',
        study: 'Ring all-reduce arranges devices in a circle and passes chunks neighbor to neighbor, so traffic per device barely grows with the count — bandwidth-optimal. Tree all-reduce instead minimizes latency; libraries like NCCL pick between them by message size and topology.' },
      { id: 'overlap', term: 'Compute–comm overlap',
        prompt: 'How do you hide communication cost', answer: 'overlap it with compute',
        study: 'The key optimization is overlapping communication with computation: start all-reducing the early gradients while later layers are still computing backward, bucketing gradients so the network and the GPUs work at once. Well overlapped, communication becomes nearly free.' },
      { id: 'interconnect-tiers', term: 'Matching the network',
        prompt: 'Which parallelism needs the fastest interconnect', answer: 'tensor parallelism',
        study: 'Tensor parallelism communicates every layer, so it needs intra-node NVLink bandwidth; pipeline and data parallelism exchange far less and tolerate slower inter-node InfiniBand. Mapping each parallelism dimension to the right network tier is how you keep utilization high.' },

      { id: 'mfu', section: 'Measuring efficiency.', term: 'MFU',
        prompt: 'What does Model FLOPs Utilization measure', answer: 'achieved FLOPs over peak FLOPs',
        study: 'Model FLOPs Utilization is the honest efficiency number: the useful FLOPs your model actually achieved divided by the hardware’s peak. Real large-scale training lands around thirty to fifty percent — PaLM reported about 46% — and the rest is lost to communication, pipeline bubbles, and memory stalls.' },
      { id: 'comm-ratio', term: 'The scaling wall',
        prompt: 'Why does efficiency fall as you add more devices', answer: 'communication grows faster than compute',
        study: 'Scaling out adds communication that eventually outpaces the extra compute — the communication-to-computation ratio rises and MFU falls. Fighting that, with bigger local work, better overlap, and topology-aware placement, is the whole game of scaling training.' },
      { id: 'straggler', term: 'Stragglers & fault tolerance',
        prompt: 'In synchronous training, what gates each step', answer: 'the slowest worker',
        study: 'Synchronous training moves in lockstep, so every step waits on the slowest worker — one straggler or one failed node stalls thousands of GPUs. At scale this makes checkpointing and fault tolerance first-class concerns, not afterthoughts.' },
    ],
  },

  numerics: {
    id: 'numerics',
    title: 'Numbers & precision',
    kind: 'pairs',
    studyLead: 'Why the bits a model computes in matter as much as how many. Float formats, the precision-versus-range tradeoff, and how low you can go. Read each idea, then say the answer aloud.',
    facts: [
      { id: 'float-anatomy', section: 'How a float is built.', term: 'Anatomy of a float',
        prompt: 'A floating-point number splits into which three parts', answer: 'sign, exponent, mantissa',
        study: 'A float is three fields: a sign bit, an exponent, and a mantissa, the fraction. The exponent sets the range — how big or small a number — and the mantissa sets the precision — how many significant digits. Every format is a budget split between those two.',
        note: 'Bit splits — sign / exponent / mantissa: FP32 1/8/23, TF32 1/8/10, FP16 1/5/10, BF16 1/8/7, FP8 as E4M3 1/4/3 or E5M2 1/5/2, FP4 as E2M1 1/2/1.' },
      { id: 'exp-vs-mantissa', term: 'Range vs precision',
        prompt: 'Exponent bits buy range; mantissa bits buy what', answer: 'precision',
        study: 'More exponent bits widen the dynamic range you can represent; more mantissa bits sharpen precision within it. Low-precision ML formats spend their scarce bits deliberately — usually protecting range over precision.' },
      { id: 'fp32', term: 'FP32',
        prompt: 'What is FP32', answer: 'the 32-bit full-precision baseline',
        study: 'FP32 is 32 bits — 1 sign, 8 exponent, 23 mantissa. It’s the classic full-precision format and the reference everything else is compared against: accurate, but bandwidth- and compute-hungry.' },
      { id: 'tf32', term: 'TF32',
        prompt: 'What is TF32', answer: 'FP32 range with a shorter mantissa',
        study: 'TF32, NVIDIA’s tensor-core format, keeps FP32’s 8 exponent bits but trims the mantissa to 10 — FP32’s range at lower precision. Frameworks use it transparently to speed up matmuls with little accuracy loss.' },
      { id: 'fp16', section: 'The formats that train models.', term: 'FP16',
        prompt: 'What is FP16’s weakness for training', answer: 'narrow dynamic range',
        study: 'FP16 is 16 bits — 5 exponent, 10 mantissa — so its range is narrow, topping out near 65,504; gradients easily underflow to zero or overflow to infinity. Training in FP16 needs loss scaling to stay in range.' },
      { id: 'bf16', term: 'BF16',
        prompt: 'Why did BF16 win for training', answer: 'FP32’s range in 16 bits',
        study: 'BF16 keeps all 8 exponent bits of FP32 but only 7 mantissa bits — same range, less precision. That range is what gradients need, so BF16 trains stably without loss scaling. It’s why BF16 became the default training format.',
        note: 'FP16 and BF16 are both 16 bits — the whole difference is the split: FP16 favors precision, BF16 favors range.' },
      { id: 'loss-scaling', term: 'Loss scaling',
        prompt: 'What does loss scaling fix in FP16 training', answer: 'gradient underflow',
        study: 'Loss scaling multiplies the loss by a large factor before the backward pass, lifting tiny gradients into FP16’s representable range, then divides it back out before the update. BF16’s wider range makes it unnecessary.' },
      { id: 'mixed-precision', term: 'Mixed precision',
        prompt: 'What is mixed-precision training', answer: 'low-precision math, an FP32 master copy',
        study: 'Mixed precision runs the heavy matmuls in BF16 or FP16 for speed and memory, while keeping a master FP32 copy of the weights and accumulating in FP32 for stability. Low-precision throughput, high-precision accuracy.' },
      { id: 'fp8', section: 'Going lower for inference.', term: 'FP8',
        prompt: 'What does FP8 come in two flavors of', answer: 'E4M3 for precision, E5M2 for range',
        study: 'FP8 is standardized as two types whose names encode the split — E4M3 (4 exponent, 3 mantissa) leans to precision, E5M2 (5 exponent, 2 mantissa) to range. It halves memory and roughly doubles tensor-core throughput versus 16-bit, and is now used in training as well as inference on Hopper and Blackwell.' },
      { id: 'fp4', term: 'FP4',
        prompt: 'What is FP4 mainly for', answer: 'maximum inference throughput',
        study: 'FP4 packs a number into four bits — typically E2M1, just sixteen representable values — so quadruple the throughput of 16-bit and a fourfold memory cut. Blackwell’s headline numbers are FP4; it’s an inference format kept usable by careful scaling.' },
      { id: 'quantization', term: 'Quantization',
        prompt: 'What is quantization', answer: 'storing weights in fewer bits',
        study: 'Quantization converts trained weights and activations to lower precision — FP16 to FP8 to INT4 — shrinking the model and speeding inference. Because decode is memory-bound, smaller weights are often directly faster.' },
      { id: 'quant-methods', term: 'PTQ vs QAT',
        prompt: 'Post-training quantization versus quantization-aware training', answer: 'quantize after vs quantize during',
        study: 'Post-training quantization converts an already-trained model — cheap, with some accuracy loss. Quantization-aware training simulates low precision during training so the model adapts — more accurate, more expensive. Outlier-aware methods protect the few large values that matter most.' },
      { id: 'dynamic-range', term: 'Scaling factors',
        prompt: 'Why do low-precision formats need scaling factors', answer: 'to keep values in representable range',
        study: 'Low-precision formats have tiny dynamic range, so tensors are multiplied by per-tensor or per-block scaling factors to fit into the representable window, then unscaled after. Getting scaling right is most of what makes FP8 and FP4 work.' },
    ],
  },

  memory: {
    id: 'memory',
    title: 'Memory & roofline',
    kind: 'pairs',
    studyLead: 'Most of the time, chips aren’t waiting on math — they’re waiting on memory. The hierarchy, the bandwidth wall, and the model that predicts which one binds you. Read each idea, then say the answer aloud.',
    facts: [
      { id: 'hierarchy', section: 'The memory hierarchy.', term: 'Memory hierarchy',
        prompt: 'Order the GPU memory hierarchy fast to slow', answer: 'registers, SRAM, HBM',
        study: 'A GPU’s memory is a hierarchy: registers and on-chip SRAM (shared memory and cache) are tiny but blazing fast; HBM — the tens of gigabytes of high-bandwidth memory — is large but far slower per byte. Performance is largely about keeping data in the fast tiers.' },
      { id: 'hbm', term: 'HBM',
        prompt: 'What is HBM', answer: 'the GPU’s high-bandwidth main memory',
        study: 'HBM is the stacked DRAM beside the GPU die: an H100 holds 80GB at about 3.35 TB/s, an H200 141GB at about 4.8 TB/s, a B200 192GB at 8 TB/s. It’s where weights and the KV cache live, and its bandwidth caps how fast you can feed the compute.' },
      { id: 'sram', term: 'On-chip SRAM',
        prompt: 'Why is on-chip SRAM the target of kernel optimization', answer: 'far faster than HBM',
        study: 'On-chip SRAM is orders of magnitude faster than HBM but only kilobytes per core. Fast kernels — FlashAttention is the classic — restructure the math to reuse data in SRAM and touch HBM as little as possible.' },
      { id: 'arithmetic-intensity', section: 'The roofline model.', term: 'Arithmetic intensity',
        prompt: 'What is arithmetic intensity', answer: 'FLOPs per byte moved',
        study: 'Arithmetic intensity is the ratio of compute to memory traffic — FLOPs performed per byte read from memory. It’s the single number that decides whether an operation is limited by the chip’s math or by its memory bandwidth.' },
      { id: 'roofline', term: 'The roofline',
        prompt: 'What does the roofline model predict', answer: 'compute-bound or memory-bound',
        study: 'The roofline plots achievable performance against arithmetic intensity: a slanted memory-bandwidth roof rises until it meets the flat peak-compute ceiling. Low intensity sits under the slope — memory-bound; high intensity hits the ceiling — compute-bound.',
        note: 'The ridge point where the slope meets the ceiling is peak FLOPS ÷ bandwidth — for an H100, roughly 989 TFLOPS ÷ 3.35 TB/s ≈ 300 FLOPs per byte. Below that intensity you’re memory-bound; above it, compute-bound.' },
      { id: 'compute-bound', term: 'Compute-bound',
        prompt: 'What kind of operation is compute-bound', answer: 'high intensity, like big matmuls',
        study: 'Compute-bound operations — large dense matmuls, training prefill — do lots of math per byte, saturate the tensor cores, and scale with FLOPS. These are the ops where a faster chip directly helps.' },
      { id: 'memory-bound', term: 'Memory-bound',
        prompt: 'What kind of operation is memory-bound', answer: 'low intensity, like decode',
        study: 'Memory-bound operations — attention decode, elementwise ops, small batches — move lots of data per FLOP, wait on HBM, and leave the tensor cores idle. A faster chip barely helps; faster memory does.',
        note: 'This is why the H200 (same FLOPS as H100, more and faster HBM) speeds up inference — decode is memory-bound.' },
      { id: 'batch-intensity', term: 'Batching raises intensity',
        prompt: 'How does batching raise arithmetic intensity', answer: 'it reuses each weight-load across more tokens',
        study: 'Load a weight once and use it for many tokens, and arithmetic intensity climbs. That’s why bigger batches push memory-bound decode toward compute-bound — the same weights amortize over more work, lifting throughput.' },
      { id: 'training-memory', section: 'Where the memory goes.', term: 'Training memory',
        prompt: 'What are the main consumers of training memory', answer: 'weights, gradients, optimizer states, activations',
        study: 'Training memory splits four ways: the weights, their gradients, the optimizer states (Adam’s two moments), and the activations saved for backprop. Activations and optimizer states usually dominate — exactly what checkpointing and ZeRO attack.',
        note: 'In mixed-precision Adam, weights + gradients + optimizer state run about 16 bytes per parameter — so a 1-billion-parameter model needs ~16 GB before activations. That’s why large models can’t sit on one GPU.' },
      { id: 'kv-cache-memory', term: 'KV cache growth',
        prompt: 'What grows the KV cache at inference', answer: 'batch size times context length',
        study: 'The KV cache stores keys and values for every token, so it grows with batch size times sequence length times layers. At long context and high concurrency it can rival the weights themselves — the main memory pressure in serving.' },
      { id: 'bandwidth-wall', term: 'The memory wall',
        prompt: 'Why is memory called the wall', answer: 'bandwidth grows slower than compute',
        study: 'Compute has grown far faster than memory bandwidth across GPU generations, so more workloads become memory-bound over time — the memory wall. It’s why HBM capacity and bandwidth, not just FLOPS, increasingly drive hardware value.' },
    ],
  },

  interconnect: {
    id: 'interconnect',
    title: 'Interconnect & networking',
    kind: 'pairs',
    studyLead: 'A frontier model lives across thousands of chips, so how they talk decides how fast they learn. The links, the fabrics, the topologies, and the collectives that ride them. Read each idea, then say the answer aloud.',
    facts: [
      { id: 'nvlink', section: 'Inside the node.', term: 'NVLink',
        prompt: 'What is NVLink', answer: 'NVIDIA’s fast GPU-to-GPU link',
        study: 'NVLink is NVIDIA’s direct GPU-to-GPU interconnect inside a server — about 900 GB/s per GPU on Hopper, 1.8 TB/s on Blackwell, far faster than PCIe. It’s what makes tensor parallelism, with its every-layer communication, viable within a node.' },
      { id: 'nvswitch', term: 'NVSwitch',
        prompt: 'What does NVSwitch add over NVLink', answer: 'all-to-all GPU connectivity',
        study: 'NVSwitch is the crossbar joining many NVLinks, so every GPU in a node — or an NVL72 rack — talks to every other at full bandwidth, not just its neighbors. It turns a box of GPUs into one tightly-coupled unit.' },
      { id: 'pcie', term: 'PCIe',
        prompt: 'Where does PCIe sit', answer: 'the slower host-to-device link',
        study: 'PCIe connects GPUs to the CPU, and to each other when NVLink is absent — PCIe 5.0 by sixteen lanes is about 64 GB/s, an order of magnitude below NVLink. Data loading rides PCIe; heavy GPU-to-GPU traffic avoids it.' },
      { id: 'infiniband', section: 'Across the cluster.', term: 'InfiniBand / RoCE',
        prompt: 'What connects nodes in a GPU cluster', answer: 'InfiniBand or RoCE',
        study: 'Between servers, GPUs talk over InfiniBand or RoCE (RDMA over Ethernet) — high-bandwidth, low-latency fabrics with RDMA; current InfiniBand NDR runs 400 gigabits per second per port. This inter-node tier is slower than NVLink, so you keep the chattiest parallelism inside the node.' },
      { id: 'rdma', term: 'RDMA',
        prompt: 'What does RDMA let a GPU do', answer: 'write remote memory, bypassing the CPU',
        study: 'RDMA — remote direct memory access — lets a network card move data straight into another machine’s memory without the CPU or OS in the path. GPUDirect extends it GPU-to-GPU across the network, cutting collective latency.' },
      { id: 'topology', term: 'Fat-tree topology',
        prompt: 'What is a rail-optimized fat-tree', answer: 'a non-blocking cluster network',
        study: 'Large clusters wire nodes in a fat-tree — a multi-level switch hierarchy with equal bandwidth at every level, so any pair can communicate without contention. Rail-optimized layouts align each GPU to its own network rail, matching the all-reduce pattern.' },
      { id: 'tpu-ici', term: 'TPU ICI & pods',
        prompt: 'How are TPUs interconnected in a pod', answer: 'ICI links in a torus',
        study: 'TPUs connect over Inter-Chip Interconnect directly chip-to-chip, wired as a 2D or 3D torus with no switches. A TPU v4 pod is 4,096 chips in one such mesh — a different philosophy from NVIDIA’s switched fabric.' },
      { id: 'collectives', section: 'Moving the data.', term: 'Collectives',
        prompt: 'What collective operations ride the fabric', answer: 'all-reduce, all-gather, all-to-all',
        study: 'Distributed training is built from collectives — all-reduce, all-gather, reduce-scatter, broadcast, all-to-all — run by NCCL on NVIDIA and the XLA runtime on TPU. Their speed is set by the slowest link in the path.' },
      { id: 'ring-vs-tree', term: 'Ring vs tree',
        prompt: 'Ring all-reduce optimizes bandwidth; tree optimizes what', answer: 'latency',
        study: 'A ring all-reduce passes fixed-size chunks around a circle — bandwidth-optimal, independent of node count, but higher latency. A tree reduces up and broadcasts down — lower latency for small messages. NCCL switches by message size and topology.' },
      { id: 'bw-latency', term: 'Bandwidth vs latency',
        prompt: 'The two numbers that characterize any link', answer: 'bandwidth and latency',
        study: 'Every interconnect has bandwidth — bytes per second, capping big transfers — and latency — the fixed per-message delay, dominating small ones. Big gradient all-reduces are bandwidth-bound; frequent small syncs are latency-bound.' },
      { id: 'overlap-net', term: 'Overlap',
        prompt: 'How do you keep the network from stalling compute', answer: 'overlap communication with computation',
        study: 'The fabric is only free if it runs behind the math: start all-reducing each gradient bucket as it’s ready while later layers still compute backward. Perfect overlap keeps scaling near-linear; broken overlap caps your speedup.' },
    ],
  },

  scaling: {
    id: 'scaling',
    title: 'Scaling & economics',
    kind: 'pairs',
    studyLead: 'How much compute a model needs, where to spend it, and what it costs. The laws that guide the spend and the numbers that measure the return. Read each idea, then say the answer aloud.',
    facts: [
      { id: 'scaling-laws', section: 'The scaling laws.', term: 'Scaling laws',
        prompt: 'What do neural scaling laws describe', answer: 'loss falls as a power law in compute',
        study: 'Scaling laws say a model’s loss drops predictably — as a power law — with more parameters, data, and compute. Smooth curves across many orders of magnitude are what let labs forecast a big model’s quality before training it.' },
      { id: 'six-nd', term: 'The 6ND rule',
        prompt: 'What does the 6ND rule estimate', answer: 'training FLOPs',
        study: 'Training compute is roughly six times parameters times tokens: C ≈ 6·N·D. The six covers the forward and backward pass per parameter per token. Worked example: GPT-3, 175 billion parameters over 300 billion tokens, is about 3×10^23 FLOPs — the back-of-envelope every compute discussion starts from.',
        note: 'Inference is about 2ND — just the forward pass — per pass over the parameters.' },
      { id: 'chinchilla', term: 'Chinchilla',

let TOPIC_LIST = Object.values(TOPICS);
const BUILTIN_IDS = Object.keys(TOPICS);

// ---------- custom topics (user-authored term↔answer pairs, persisted) ----------
const CUSTOM_KEY = 'ingrain:topics';
function customStore() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || {}; } catch (e) { return {}; }
}
function saveCustomStore(obj) {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(obj)); } catch (e) {}
}
/** Merge persisted custom topics into TOPICS; drop any that were deleted. */
function loadCustomTopics() {
  for (const id of Object.keys(TOPICS)) if (!BUILTIN_IDS.includes(id)) delete TOPICS[id];
  for (const t of Object.values(customStore())) {
    if (t && t.id && Array.isArray(t.facts) && t.facts.length) TOPICS[t.id] = t;
  }
  TOPIC_LIST = Object.values(TOPICS);
}
/** "prompt = answer" lines → pair facts. Accepts = :: | — – or a tab as separator. */
function parsePairsInput(text) {
  const out = [];
  String(text || '').split('\n').forEach(line => {
    const m = line.match(/^\s*(.+?)\s*(?:=|::|\||—|–|\t)\s*(.+?)\s*$/);
    if (!m) return;
    const prompt = m[1].trim(), answer = m[2].trim();
    if (prompt && answer) out.push({ id: 'f' + out.length, prompt, answer, note: null });
  });
  return out;
}
loadCustomTopics();
