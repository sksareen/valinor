<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>Letters</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070910;
    font-family: Lato, sans-serif; color: #e2e8f0; }

  /* ===== gallery: letters as a pile of paper cards ===== */
  #gallery { position: fixed; inset: 0; overflow-y: auto; padding: 74px 40px 60px; }
  #gtitle { position: fixed; top: 20px; left: 28px; z-index: 5; font-size: 13px; font-weight: 700;
    letter-spacing: .14em; color: #7dd3fc; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 26px;
    max-width: 1200px; margin: 0 auto; }
  .letter { position: relative; min-height: 210px; padding: 20px 22px; cursor: pointer;
    background: #14161f; border: 1px solid rgba(255,255,255,.09); border-radius: 4px;
    box-shadow: 0 10px 28px rgba(0,0,0,.5); transition: transform .15s, box-shadow .15s;
    display: flex; flex-direction: column; overflow: hidden; }
  .letter:nth-child(3n)   { rotate: 0.7deg; }
  .letter:nth-child(3n+1) { rotate: -0.6deg; }
  .letter:hover { transform: translateY(-5px); box-shadow: 0 18px 42px rgba(0,0,0,.65);
    border-color: rgba(125,211,252,.4); rotate: 0deg; }
  /* ruled paper lines */
  .letter .rule { position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(transparent, transparent 27px, rgba(255,255,255,.045) 27px, rgba(255,255,255,.045) 28px);
    background-position-y: 58px; }
  .letter .date { font-size: 11px; color: #64748b; letter-spacing: .06em; text-align: right; }
  .letter h3 { font-size: 16.5px; font-weight: 700; color: #e8eaf0; margin: 8px 0 10px; line-height: 1.25; }
  .letter .prev { font-size: 12.5px; line-height: 28px; color: #94a3b8; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .letter .del { position: absolute; top: 8px; left: 10px; border: none; background: none; color: transparent;
    font-size: 13px; cursor: pointer; }
  .letter:hover .del { color: #64748b; }
  .letter .del:hover { color: #f87171; }
  .letter.new { align-items: center; justify-content: center; border-style: dashed;
    border-color: rgba(125,211,252,.35); background: rgba(125,211,252,.04); color: #7dd3fc;
    font-weight: 600; font-size: 14px; min-height: 210px; rotate: 0deg; }
  .letter.new:hover { background: rgba(125,211,252,.09); }
  .letter.new .plus { font-size: 34px; margin-bottom: 8px; font-weight: 400; }

  /* ===== editor: full-screen letter ===== */
  #editor { position: fixed; inset: 0; z-index: 20; display: none; background: #0b0d15; overflow-y: auto; }
  #editor.show { display: block; }
  #ehead { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; background: rgba(11,13,21,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.06); }
  #ehead .meta { font-size: 12px; color: #64748b; }
  #ehead .meta b { color: #94a3b8; }
  #closeBtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: #e2e8f0; font-size: 15px; cursor: pointer; }
  #closeBtn:hover { background: #ef4444; color: #fff; border-color: transparent; }
  #paper { max-width: 720px; margin: 34px auto 120px; padding: 46px 54px; min-height: 70vh;
    background: #12141d; border: 1px solid rgba(255,255,255,.07); border-radius: 4px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55); }
  #sheet { outline: none; min-height: 60vh; font-size: 16px; line-height: 1.75; color: #dfe3ea;
    caret-color: #7dd3fc; }
  #sheet:empty::before { content: 'Dear me,'; color: #475569; }
  /* obsidian-ish typography */
  #sheet h1 { font-size: 27px; line-height: 1.3; margin: .5em 0 .3em; color: #f1f5f9; }
  #sheet h2 { font-size: 21px; line-height: 1.3; margin: .6em 0 .25em; color: #eef2f7; }
  #sheet h3 { font-size: 17.5px; margin: .6em 0 .2em; color: #e2e8f0; }
  #sheet ul, #sheet ol { padding-left: 1.5em; margin: .25em 0; }
  #sheet li { margin: .15em 0; }
  #sheet blockquote { border-left: 3px solid #7dd3fc; padding: .1em 0 .1em 1em; margin: .4em 0;
    color: #a8b3c4; }
  #sheet code { background: rgba(125,211,252,.12); border-radius: 4px; padding: .08em .35em;
    font-size: .92em; color: #9bdcfd; }
  #sheet b, #sheet strong { color: #f1f5f9; }
  #savestat { font-size: 11px; color: #475569; }
  #mdhint { max-width: 720px; margin: 10px auto 0; text-align: center; font-size: 11.5px; color: #3f4a5c; }
  #mdhint b { color: #5b6b82; }
</style>
</head>
<body>
  <div id="gallery">
    <div id="gtitle">LETTERS</div>
    <div id="grid"></div>
  </div>

  <div id="editor">
    <div id="ehead">
      <div class="meta"><b id="etitle">New letter</b> · <span id="edate"></span> · <span id="savestat"></span></div>
      <button id="closeBtn" title="close (Esc)">✕</button>
    </div>
    <div id="paper"><div id="sheet" contenteditable="true" spellcheck="true"></div></div>
    <div id="mdhint"><b># </b>heading · <b>- </b>list · <b>> </b>quote · <b>**bold**</b> · <b>*italic*</b> · <b>`code`</b> · <b>⌘B/⌘I</b></div>
  </div>

<script src="hub-client.js"></script>
<script>
if (location.protocol === 'file:') location.replace('http://localhost:4777/letters.html');
HubClient.forwardNavKeys();   // 1–7 nav works from the gallery (not while writing — contenteditable is skipped)

const $ = (id) => document.getElementById(id);
const grid = $('grid'), editor = $('editor'), sheet = $('sheet');
let current = null;         // filename of the open letter
let saveT = null, dirty = false;

// ================= markdown <-> DOM (the subset the editor produces) =================
function mdToDom(md) {
  const frag = document.createDocumentFragment();
  let list = null, listType = '';
  const inline = (s) => {
    s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  };
  const flushList = () => { if (list) { frag.appendChild(list); list = null; } };
  for (const line of (md || '').split('\n')) {
    let m;
    if ((m = line.match(/^(#{1,3}) (.*)/))) {
      flushList();
      const h = document.createElement('h' + m[1].length);
      h.innerHTML = inline(m[2]) || '<br>'; frag.appendChild(h);
    } else if ((m = line.match(/^- (.*)/))) {
      if (!list || listType !== 'ul') { flushList(); list = document.createElement('ul'); listType = 'ul'; }
      const li = document.createElement('li'); li.innerHTML = inline(m[1]) || '<br>'; list.appendChild(li);
    } else if ((m = line.match(/^\d+\. (.*)/))) {
      if (!list || listType !== 'ol') { flushList(); list = document.createElement('ol'); listType = 'ol'; }
      const li = document.createElement('li'); li.innerHTML = inline(m[1]) || '<br>'; list.appendChild(li);
    } else if ((m = line.match(/^> (.*)/))) {
      flushList();
      const q = document.createElement('blockquote'); q.innerHTML = inline(m[1]) || '<br>'; frag.appendChild(q);
    } else {
      flushList();
      const p = document.createElement('div'); p.innerHTML = inline(line) || '<br>'; frag.appendChild(p);
    }
  }
  flushList();
  return frag;
}
function domToMd(root) {
  const inline = (node) => {
    let out = '';
    for (const n of node.childNodes) {
      if (n.nodeType === 3) out += n.textContent;
      else if (n.nodeName === 'B' || n.nodeName === 'STRONG') out += '**' + inline(n) + '**';
      else if (n.nodeName === 'I' || n.nodeName === 'EM') out += '*' + inline(n) + '*';
      else if (n.nodeName === 'CODE') out += '`' + inline(n) + '`';
      else if (n.nodeName === 'BR') out += '';
      else out += inline(n);
    }
    return out;
  };
  const lines = [];
  for (const el of root.childNodes) {
    if (el.nodeType === 3) { lines.push(el.textContent); continue; }
    const tag = el.nodeName;
    if (tag === 'H1') lines.push('# ' + inline(el));
    else if (tag === 'H2') lines.push('## ' + inline(el));
    else if (tag === 'H3') lines.push('### ' + inline(el));
    else if (tag === 'UL') for (const li of el.children) lines.push('- ' + inline(li));
    else if (tag === 'OL') { let i = 1; for (const li of el.children) lines.push((i++) + '. ' + inline(li)); }
    else if (tag === 'BLOCKQUOTE') lines.push('> ' + inline(el));
    else lines.push(inline(el));
  }
  return lines.join('\n');
}

// ================= live input rules (Obsidian-style) =================
// Block rules fire on space at line start; inline rules fire when the closing marker lands.
sheet.addEventListener('input', () => {
  dirty = true; scheduleSave();
  const sel = getSelection();
  if (!sel || !sel.anchorNode) return;
  const node = sel.anchorNode;
  if (!node || node.nodeType !== 3) return;
  const text = node.textContent;

  // block transforms: "# " "## " "### " "- " "1. " "> " at the start of a plain block
  const block = node.parentElement?.closest('#sheet > *');
  if (block && ['DIV', 'P'].includes(block.nodeName) && node === block.firstChild) {
    let m;
    if ((m = text.match(/^(#{1,3}) $/))) { transformBlock(block, 'H' + m[1].length); return; }
    if (text === '- ' || text === '* ') { wrapList(block, 'ul'); return; }
    if (/^1\. $/.test(text)) { wrapList(block, 'ol'); return; }
    if (text === '> ') { transformBlock(block, 'BLOCKQUOTE'); return; }
  }
  // inline transforms on close: **bold**  *italic*  `code`
  let m;
  if ((m = text.match(/\*\*([^*]+)\*\*$/))) inlineWrap(node, m.index, m[0].length, 'b', m[1]);
  else if ((m = text.match(/(^|[^*])\*([^*\s][^*]*)\*$/))) inlineWrap(node, m.index + m[1].length, m[0].length - m[1].length, 'i', m[2]);
  else if ((m = text.match(/`([^`]+)`$/))) inlineWrap(node, m.index, m[0].length, 'code', m[1]);
});
function transformBlock(block, tag) {
  const el = document.createElement(tag);
  el.innerHTML = '<br>';
  block.replaceWith(el);
  setCaret(el);
}
function wrapList(block, kind) {
  const list = document.createElement(kind);
  const li = document.createElement('li');
  li.innerHTML = '<br>';
  list.appendChild(li);
  block.replaceWith(list);
  setCaret(li);
}
function inlineWrap(textNode, start, len, tag, content) {
  const el = document.createElement(tag);
  el.textContent = content;
  const after = textNode.splitText(start);
  after.textContent = after.textContent.slice(len);
  after.parentNode.insertBefore(el, after);
  // caret after the new element (with a space landing zone)
  const sp = document.createTextNode(' ');
  after.parentNode.insertBefore(sp, after);
  const sel = getSelection(), r = document.createRange();
  r.setStartAfter(sp); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
  dirty = true; scheduleSave();
}
function setCaret(el) {
  const sel = getSelection(), r = document.createRange();
  r.selectNodeContents(el); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}
// Enter in a heading/quote returns to plain text on the next line (Obsidian behavior)
sheet.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    const block = getSelection().anchorNode?.parentElement?.closest('#sheet > *');
    if (block && /^H[1-3]$|^BLOCKQUOTE$/.test(block.nodeName)) {
      e.preventDefault();
      const p = document.createElement('div'); p.innerHTML = '<br>';
      block.after(p); setCaret(p);
      dirty = true; scheduleSave();
    }
  }
});

// ================= persistence =================
function scheduleSave() {
  clearTimeout(saveT);
  $('savestat').textContent = 'writing…';
  saveT = setTimeout(save, 600);
}
async function save() {
  if (!current || !dirty) return;
  const md = domToMd(sheet);
  await fetch('/api/letter/' + current, { method: 'POST', body: md }).catch(() => {});
  dirty = false;
  $('savestat').textContent = 'saved';
  $('etitle').textContent = titleOf(md);
}
function titleOf(md) {
  const first = (md || '').split('\n').find(l => l.trim());
  return (first || 'Untitled').replace(/^#{1,3} /, '').replace(/[*`>]/g, '').slice(0, 60) || 'Untitled';
}
const fmtDate = (ms) => new Date(ms).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

// ================= gallery =================
async function loadGallery() {
  let letters = [];
  try { letters = await (await fetch('/api/letters')).json(); } catch (e) {}
  grid.innerHTML = '';
  const add = document.createElement('div');
  add.className = 'letter new';
  add.innerHTML = '<div class="plus">+</div><div>New letter</div>';
  add.onclick = () => openLetter(null);
  grid.appendChild(add);
  for (const l of letters) {
    const el = document.createElement('div');
    el.className = 'letter';
    const title = titleOf(l.preview);
    const body = (l.preview || '').split('\n').filter(x => x.trim()).slice(1).join(' ')
      .replace(/[#*`>]/g, '').slice(0, 220);
    el.innerHTML = `<div class="rule"></div><button class="del" title="delete">✕</button>` +
      `<div class="date">${fmtDate(l.mtime)}</div><h3></h3><div class="prev"></div>`;
    el.querySelector('h3').textContent = title;
    el.querySelector('.prev').textContent = body || '…';
    el.onclick = (e) => { if (!e.target.classList.contains('del')) openLetter(l.file); };
    el.querySelector('.del').onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(`Delete "${title}"? The markdown file is removed.`)) return;
      await fetch('/api/letter/' + l.file, { method: 'DELETE' }).catch(() => {});
      loadGallery();
    };
    grid.appendChild(el);
  }
}

// ================= open / close =================
async function openLetter(file) {
  if (!file) {
    const d = new Date();
    file = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}-${d.getTime().toString(36)}.md`;
    current = file;
    sheet.innerHTML = '';
    $('etitle').textContent = 'New letter';
    $('edate').textContent = fmtDate(Date.now());
    dirty = true;               // ensures even an empty first save creates the file on write
  } else {
    current = file;
    let md = '';
    try { md = await (await fetch('/api/letter/' + file)).text(); } catch (e) {}
    sheet.innerHTML = '';
    sheet.appendChild(mdToDom(md));
    $('etitle').textContent = titleOf(md);
    $('edate').textContent = '';
    dirty = false;
  }
  $('savestat').textContent = '';
  editor.classList.add('show');
  sheet.focus();
}
async function closeLetter() {
  clearTimeout(saveT);
  const md = domToMd(sheet);
  if (current && md.trim()) { dirty = true; await save(); }
  editor.classList.remove('show');
  current = null;
  loadGallery();
}
$('closeBtn').onclick = closeLetter;
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && editor.classList.contains('show')) closeLetter();
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); dirty = true; save(); }
});

loadGallery();
</script>
</body>
</html>
