<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adventures — prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root, html[data-theme="dark"] {
    --bg: #070910; --bg-elev: #12141d; --ink: #e2e8f0; --ink-dim: #cbd5e1; --dim: #94a3b8; --mute: #64748b;
    --accent: #7dd3fc; --accent-ink: #070910; --accent2: #c4b5fd; --line: rgba(255,255,255,.08);
  }
  html[data-theme="light"] {
    --bg: #f8fafc; --bg-elev: #ffffff; --ink: #0f172a; --ink-dim: #334155; --dim: #475569; --mute: #64748b;
    --accent: #0284c7; --accent-ink: #fff; --accent2: #6d28d9; --line: rgba(15,23,42,.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: Lato, sans-serif; }
  html[data-hub-layout="left"] body, html[data-hub-fit="inset"] body { padding-left: 0; }
  body { display: grid; grid-template-columns: 240px 1fr; overflow: hidden; padding-top: var(--hub-pad-top, 0px); padding-left: var(--hub-pad-left, 0px); }

  #rail { border-right: 1px solid var(--line); overflow-y: auto; padding: 20px 14px; background: var(--bg); }
  #rail h1 { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--accent); margin-bottom: 6px; }
  #rail .blurb { font-size: 12px; line-height: 1.45; color: var(--mute); margin-bottom: 22px; }
  .bucket { margin-bottom: 18px; }
  .bucket label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--mute); margin: 0 4px 8px; }
  .bucket.you label { color: var(--accent); }
  .card { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    background: color-mix(in srgb, var(--ink) 4%, transparent); border: 1px solid transparent; }
  .card:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .card.on { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .card .t { font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .card .s { margin-top: 3px; font-size: 11px; color: var(--mute); }

  #main { overflow-y: auto; padding: 28px 36px 80px; max-width: 720px; background: var(--bg); }
  #main h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
  .meta { margin-top: 8px; font-size: 13px; color: var(--dim); }
  .meta b { color: var(--accent); font-weight: 700; }
  .meta b.agent { color: var(--accent2); }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 22px 0 28px; }
  .stage { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 999px; color: var(--mute); border: 1px solid var(--line); }
  .stage.done { color: #4ade80; border-color: rgba(74,222,128,.3); }
  .stage.cur { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

  .turn { display: grid; grid-template-columns: 64px 1fr; gap: 12px; margin-bottom: 12px; }
  .turn .who { text-align: right; padding-top: 10px; font-size: 10px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; }
  .turn.you .who { color: var(--accent); }
  .turn.agent .who { color: var(--accent2); }
  .turn .body { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 14px; font-size: 13.5px; line-height: 1.55; color: var(--ink-dim); }
  .turn.you .body { border-left: 2px solid var(--accent); }
  .turn.agent .body { border-left: 2px solid var(--accent2); }
  .turn .kind { font-size: 10px; color: var(--mute); margin-bottom: 4px; text-transform: uppercase;
    letter-spacing: .04em; font-weight: 700; }

  .composer { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  textarea { width: 100%; min-height: 56px; resize: vertical; font: 400 13.5px Lato, sans-serif;
    color: var(--ink); background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; outline: none; line-height: 1.5; }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { font: 700 12px Lato, sans-serif; letter-spacing: .03em; border: none; border-radius: 8px;
    padding: 9px 14px; cursor: pointer; }
  .go { background: var(--accent); color: var(--accent-ink); }
  .go:hover { filter: brightness(1.08); }
  .alt { background: color-mix(in srgb, var(--accent2) 16%, transparent); color: var(--accent2); border: 1px solid color-mix(in srgb, var(--accent2) 35%, transparent); }
  .alt:hover { filter: brightness(1.12); }
  .hint { margin-top: 10px; font-size: 11.5px; color: var(--mute); line-height: 1.45; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div id="rail">
    <h1>ADVENTURES</h1>
    <p class="blurb">One cycle of work. Turns from you and the agent. At any moment, it's someone's move.</p>
    <div id="buckets"></div>
  </div>
  <div id="main"></div>

<script>
const STAGES = ['intent', 'spec', 'build', 'review', 'ship'];

const DATA = [
  {
    id: 'a',
    title: 'Valinor convos tab',
    stage: 'review',
    whose: 'you',
    turns: [
      { who: 'you', kind: 'intent', text: 'Make a tab to view past agent conversations.' },
      { who: 'agent', kind: 'session', text: 'Built the CONVOS tab + /api/conversations.' },
      { who: 'you', kind: 'feedback', text: 'Previous sessions have a lot of duplications — why?' },
      { who: 'agent', kind: 'session', text: 'Three causes. Deduped 3352 → 900. Fixed the hook race.' },
      { who: 'you', kind: 'approval', text: 'Awesome, thank you.' },
    ],
  },
  {
    id: 'b',
    title: 'Adventures concept',
    stage: 'spec',
    whose: 'agent',
    turns: [
      { who: 'you', kind: 'intent', text: 'Track shared work cycles between me and the agent.' },
      { who: 'agent', kind: 'session', text: 'Researched Loopkeeper + Sauron. Wrote a plan.' },
      { who: 'you', kind: 'feedback', text: 'Before implementing — make a simple HTML prototype.' },
    ],
  },
  {
    id: 'c',
    title: 'Rehearse mic error',
    stage: 'build',
    whose: 'you',
    turns: [
      { who: 'you', kind: 'intent', text: 'Fix the mic error on the rehearse tab.' },
      { who: 'agent', kind: 'blocker', text: 'Need to know if Wispr Flow holds the mic exclusively.' },
    ],
  },
];

let selected = 'a';
let draftMsg = '';
const $ = (id) => document.getElementById(id);
const loop = () => DATA.find(l => l.id === selected);

function render() {
  const buckets = [
    { key: 'you', label: 'Your move', list: DATA.filter(l => l.whose === 'you') },
    { key: 'agent', label: "Agent's move", list: DATA.filter(l => l.whose === 'agent') },
  ];
  $('buckets').innerHTML = buckets.map(b => `
    <div class="bucket ${b.key}">
      <label>${b.label}</label>
      ${b.list.map(l => `
        <div class="card ${l.id === selected ? 'on' : ''}" data-id="${l.id}">
          <div class="t">${l.title}</div>
          <div class="s">${l.stage}</div>
        </div>`).join('')}
    </div>`).join('');

  for (const el of document.querySelectorAll('.card')) {
    el.onclick = () => {
      const cur = document.getElementById('msg');
      if (cur) draftMsg = cur.value;
      selected = el.dataset.id; render();
    };
  }

  const l = loop();
  const si = STAGES.indexOf(l.stage);
  $('main').innerHTML = `
    <h2>${l.title}</h2>
    <div class="meta">
      <b class="${l.whose === 'agent' ? 'agent' : ''}">${l.whose === 'you' ? 'your move' : "agent's move"}</b>
      · ${l.stage}
    </div>
    <div class="stages">
      ${STAGES.map((s, i) => `<span class="stage ${i < si ? 'done' : i === si ? 'cur' : ''}">${s}</span>`).join('')}
    </div>
    ${l.turns.map(t => `
      <div class="turn ${t.who}">
        <div class="who">${t.who === 'you' ? 'you' : 'agent'}</div>
        <div class="body"><div class="kind">${t.kind}</div>${t.text}</div>
      </div>`).join('')}
    <div class="composer">
      <textarea id="msg" placeholder="Your turn…"></textarea>
      <div class="row">
        <button class="go" id="send">Add turn → agent's move</button>
        <button class="alt" id="sim">Simulate agent reply → your move</button>
      </div>
      <p class="hint">Adding a turn hands it to the agent. An agent reply hands it back. That's the whole model.</p>
    </div>`;

  const msgBox = $('msg');
  if (msgBox) { msgBox.value = draftMsg; msgBox.addEventListener('input', () => { draftMsg = msgBox.value; }); }
  $('send').onclick = () => {
    const text = ($('msg').value || '').trim();
    if (!text) return;
    draftMsg = '';
    l.turns.push({ who: 'you', kind: 'feedback', text });
    l.whose = 'agent';
    render();
  };
  $('sim').onclick = () => {
    l.turns.push({ who: 'agent', kind: 'session', text: 'Did the next slice of work and reported back.' });
    if (si < STAGES.length - 1) l.stage = STAGES[si + 1];
    l.whose = 'you';
    render();
  };
}

render();
if (typeof HubClient !== 'undefined' && HubClient.forwardNavKeys) HubClient.forwardNavKeys();
</script>
<script src="hub-client.js"></script>
</body>
</html>
