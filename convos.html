<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>Conversations</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root, html[data-theme="dark"] {
    --bg: #05060a; --bg-elev: #070910; --text: #e2e8f0; --text-dim: #94a3b8;
    --text-mute: #64748b; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --chip-bg: rgba(255,255,255,.03); --accent: #a5f3fc; --accent-soft: rgba(165,243,252,.14);
    --accent-line: rgba(165,243,252,.26); --ok: #4ade80; --danger: #ef4444; --warn: #fbbf24;
  }
  html[data-theme="light"] {
    --bg: #f4f5f7; --bg-elev: #fff; --text: #0f172a; --text-dim: #475569;
    --text-mute: #64748b; --border: rgba(15,23,42,.1); --border-strong: rgba(15,23,42,.18);
    --chip-bg: rgba(15,23,42,.04); --ok: #15803d; --danger: #dc2626;
  }
  html[data-scheme="cyan"]   { --accent: #7dd3fc; --accent-soft: rgba(125,211,252,.14); --accent-line: rgba(125,211,252,.22); }
  html[data-scheme="slate"]  { --accent: #94a3b8; --accent-soft: rgba(148,163,184,.18); --accent-line: rgba(148,163,184,.28); }
  html[data-scheme="ember"]  { --accent: #d4a574; --accent-soft: rgba(212,165,116,.16); --accent-line: rgba(212,165,116,.28); }
  html[data-scheme="pine"]   { --accent: #7a9e7e; --accent-soft: rgba(122,158,126,.16); --accent-line: rgba(122,158,126,.28); }
  html[data-scheme="violet"] { --accent: #c4b5fd; --accent-soft: rgba(196,181,253,.16); --accent-line: rgba(196,181,253,.28); }
  html[data-scheme="rose"]   { --accent: #fb7185; --accent-soft: rgba(251,113,133,.16); --accent-line: rgba(251,113,133,.28); }
  html[data-scheme="gold"]   { --accent: #e8c547; --accent-soft: rgba(232,197,71,.16); --accent-line: rgba(232,197,71,.28); }
  html[data-scheme="ice"]    { --accent: #a5f3fc; --accent-soft: rgba(165,243,252,.14); --accent-line: rgba(165,243,252,.26); }
  html[data-theme="light"][data-scheme="cyan"]   { --accent: #0369a1; }
  html[data-theme="light"][data-scheme="slate"]  { --accent: #334155; }
  html[data-theme="light"][data-scheme="ember"]  { --accent: #9a6412; }
  html[data-theme="light"][data-scheme="pine"]   { --accent: #3f6b45; }
  html[data-theme="light"][data-scheme="violet"] { --accent: #6d28d9; }
  html[data-theme="light"][data-scheme="rose"]   { --accent: #be123c; }
  html[data-theme="light"][data-scheme="gold"]   { --accent: #a16207; }
  html[data-theme="light"][data-scheme="ice"]    { --accent: #0e7490; }
  html[data-font="lato"]   { --font: Lato, sans-serif; }
  html[data-font="plex"]   { --font: "IBM Plex Sans", sans-serif; }
  html[data-font="source"] { --font: Georgia, serif; }
  html[data-font="mono"]   { --font: ui-monospace, monospace; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg); font-family: var(--font, "IBM Plex Sans", Lato, sans-serif);
    font-size: 13px; color: var(--text);
  }
  body { overflow-y: auto; }

  #top {
    position: sticky; top: 0; z-index: 5;
    padding: calc(var(--hub-pad-top, 0px) + 18px) 40px 14px;
    background: color-mix(in srgb, var(--bg-elev) 92%, transparent);
    border-bottom: 1px solid var(--accent-line);
    backdrop-filter: blur(12px);
  }
  #ttitle {
    font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--accent);
    margin-bottom: 12px;
  }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 1100px; margin: 0 auto; }
  #search {
    flex: 1; min-width: 220px; padding: 8px 12px;
    font: 400 13px var(--font, inherit); color: var(--text);
    background: var(--chip-bg); border: 1px solid var(--border); border-radius: 4px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-mute); }
  .chip {
    padding: 5px 12px; font: 700 11px var(--font, inherit); letter-spacing: .04em;
    color: var(--text-mute); background: var(--chip-bg); border: 1px solid var(--border);
    border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .project-tags-block { display: flex; align-items: flex-start; gap: 8px; flex: 1 1 100%; min-width: 0; }
  .project-tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; overflow: hidden; flex: 1; min-width: 0; }
  .project-tags-wrap.is-collapsed { overflow: hidden; }
  .tags-more {
    flex: 0 0 auto; margin-top: 1px; padding: 5px 12px;
    font: 700 11px var(--font, inherit); color: var(--accent);
    background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  .tags-more:hover { border-color: var(--accent); }
  #filters {
    margin-top: 10px; display: flex; flex-direction: column; gap: 8px; max-width: 1100px;
    margin-left: auto; margin-right: auto;
    background: var(--chip-bg); border: 1px solid var(--border);
    padding: 8px 10px; border-radius: 4px;
  }
  .outcome-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #refresh {
    width: 30px; height: 30px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--chip-bg); color: var(--text-dim); font-size: 14px; cursor: pointer; flex: 0 0 auto;
  }
  #refresh:hover { color: var(--text); border-color: var(--accent-line); }
  #status { max-width: 1100px; margin: 8px auto 0; font-size: 11px; color: var(--text-mute); font-weight: 700; }

  #list { max-width: 1100px; margin: 0 auto; padding: 14px 40px 80px; display: flex; flex-direction: column; gap: 8px; }
  #empty { text-align: center; color: var(--text-mute); font-size: 13px; padding: 60px 0; font-weight: 700; }

  .card {
    background: color-mix(in srgb, var(--bg-elev) 88%, transparent); border: 1px solid var(--border);
    border-radius: 4px; padding: 0; cursor: pointer;
  }
  .card:hover { border-color: var(--accent-line); }
  .card.open { border-color: var(--accent); cursor: default; }
  .row1 {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--text-mute); }
  .dot.success { background: var(--ok); }
  .dot.failure { background: var(--danger); }
  .dot.partial { background: var(--warn); }
  .title {
    flex: 1; font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card.open .title { white-space: normal; }
  .when { font-size: 11px; color: var(--text-mute); flex: 0 0 auto; font-weight: 600; }
  .row2 {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px;
  }
  .card.open .row2 { padding-bottom: 10px; }
  .tag {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
    color: var(--text-dim); background: var(--chip-bg); border: 1px solid var(--border);
  }
  .tag.src { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .tag.src-cursor {
    color: #c4b5fd; border-color: rgba(196,181,253,.35); background: rgba(196,181,253,.14);
  }
  .tag.src-claude {
    color: #f0b27a; border-color: rgba(240,178,122,.38); background: rgba(240,178,122,.14);
  }
  html[data-theme="light"] .tag.src-cursor {
    color: #6d28d9; border-color: rgba(109,40,217,.28); background: rgba(109,40,217,.08);
  }
  html[data-theme="light"] .tag.src-claude {
    color: #b45309; border-color: rgba(180,83,9,.28); background: rgba(180,83,9,.1);
  }

  .detail {
    margin: 0; padding: 12px 14px 14px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 12px; cursor: default;
  }
  .sec label {
    display: block; font-size: 10px; font-weight: 700; color: var(--text-mute);
    text-transform: uppercase; margin-bottom: 6px; letter-spacing: .08em;
  }
  .bubbles { display: flex; flex-direction: column; gap: 6px; }
  .bubble {
    font-size: 13px; line-height: 1.55; color: var(--text);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    padding: 8px 10px; border-radius: 4px; white-space: pre-wrap;
  }
  .final { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .file {
    font-size: 11px; font-family: ui-monospace, monospace; color: var(--accent);
    background: var(--chip-bg); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px;
  }
  .fail {
    font-size: 13px; line-height: 1.55; color: #fecaca;
    background: rgba(127,29,29,.45); border: 1px solid rgba(239,68,68,.35);
    padding: 8px 10px; border-radius: 4px; white-space: pre-wrap;
  }
  html[data-theme="light"] .fail { color: #991b1b; background: #fee2e2; border-color: #fecaca; }
  .actions { display: flex; gap: 8px; padding-top: 4px; }
  .actions button {
    font: 700 11px var(--font, inherit); color: var(--text);
    background: var(--chip-bg); border: 1px solid var(--border-strong); border-radius: 4px;
    padding: 5px 12px; cursor: pointer;
  }
  .actions button:hover { border-color: var(--accent); color: var(--accent); }
  .actions button.copied { color: var(--ok); border-color: var(--ok); }

  @media (max-width: 640px) {
    #top { padding: calc(var(--hub-pad-top, 0px) + 14px) 16px 10px; }
    #ttitle { font-size: 12px; margin-bottom: 8px; }
    #controls { gap: 6px; }
    #search { min-width: 0; flex: 1 1 calc(100% - 40px); font-size: 16px; padding: 7px 10px; }
    #refresh { width: 34px; height: 34px; }
    #filters { gap: 6px; padding: 6px 8px; }
    .outcome-row {
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding-bottom: 2px; margin: 0 -8px; padding-left: 8px; padding-right: 8px;
    }
    .outcome-row::-webkit-scrollbar { display: none; }
    .chip { padding: 4px 9px; font-size: 10px; flex: 0 0 auto; }
    .project-tags-block { flex-direction: column; gap: 6px; }
    .tags-more { margin-top: 0; align-self: flex-start; }
    #status { font-size: 10px; }
    #list { padding: 10px 16px 72px; gap: 6px; }
    .row1 {
      display: grid; grid-template-columns: 8px minmax(0, 1fr) auto;
      gap: 4px 8px; align-items: start; padding: 9px 10px;
    }
    .dot { margin-top: 3px; }
    .title { font-size: 13px; white-space: normal; grid-column: 2; grid-row: 1; align-self: center; }
    .when { grid-column: 3; grid-row: 1; font-size: 10px; padding-top: 1px; white-space: nowrap; }
    .row2 { padding: 0 10px 9px; gap: 5px; }
    .tag { font-size: 9px; padding: 2px 6px; }
    .bubble, .final, .fail { font-size: 12.5px; }
    .file { font-size: 10px; word-break: break-all; }
  }
</style>
</head>
<body>
  <div id="top">
    <div id="ttitle">CONVERSATIONS</div>
    <div id="controls">
      <input id="search" type="text" placeholder="Search past sessions (semantic)…" />
      <button class="chip" id="refresh" title="reload">⟳</button>
    </div>
    <div id="filters">
      <div class="outcome-row">
        <span class="chip on" data-k="outcome" data-v="">ALL</span>
        <span class="chip" data-k="outcome" data-v="success">SUCCESS</span>
        <span class="chip" data-k="outcome" data-v="failure">FAILURE</span>
        <span class="chip" data-k="outcome" data-v="partial">PARTIAL</span>
      </div>
      <div class="project-tags-block">
        <div id="projectTagsWrap" class="project-tags-wrap"></div>
        <button type="button" id="projectTagsMore" class="tags-more" hidden>more</button>
      </div>
    </div>
    <div id="status"></div>
  </div>
  <div id="list"></div>
  <div id="empty" style="display:none;">No conversations logged yet.</div>

<script src="hub-client.js"></script>
<script>
if (location.protocol === 'file:') location.replace('http://localhost:4777/convos.html');
HubClient.forwardNavKeys();

const $ = (id) => document.getElementById(id);
const list = $('list'), empty = $('empty'), status = $('status'), search = $('search');
let records = [];
let openId = null;
let outcomeFilter = '';
let projectFilter = '';
let projectTagsExpanded = false;
let searchT = null;

function fmtWhen(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return s;
  const diffMs = Date.now() - d.getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.round(hrs / 24);
  if (days < 30) return days + 'd ago';
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function splitIntent(intent) {
  const idx = (intent || '').indexOf(': ');
  if (idx === -1 || idx > 40) return { project: '', title: intent || '(untitled)' };
  return { project: intent.slice(0, idx), title: intent.slice(idx + 2) };
}

function parseApproach(approach) {
  const parts = (approach || '').split(' | ');
  const out = { feedback: [], finalResponse: '', files: [] };
  for (const p of parts) {
    if (p.startsWith('User feedback: ')) {
      out.feedback = p.slice('User feedback: '.length).split(' → ').map(s => s.trim()).filter(Boolean);
    } else if (p.startsWith('Final response: ')) {
      out.finalResponse = p.slice('Final response: '.length).trim();
    } else if (p.startsWith('Files: ')) {
      out.files = p.slice('Files: '.length).split(', ').map(s => s.trim()).filter(Boolean);
    }
  }
  if (!out.feedback.length && !out.finalResponse) out.finalResponse = approach || '';
  return out;
}

function projectOf(rec) {
  const tags = rec.tags || [];
  return tags[2] || splitIntent(rec.task_intent).project || 'unknown';
}
function sourceOf(rec) {
  const tags = rec.tags || [];
  return tags[1] || rec.source || '';
}
function sourceKind(src) {
  const s = String(src || '').toLowerCase();
  if (/claude/.test(s)) return ' src-claude';
  if (/cursor/.test(s)) return ' src-cursor';
  return '';
}

function updateProjectTagsCollapse() {
  const wrap = $('projectTagsWrap');
  const toggle = $('projectTagsMore');
  wrap.style.maxHeight = '';
  wrap.classList.remove('is-collapsed');

  const chips = [...wrap.children];
  if (!chips.length) {
    toggle.hidden = true;
    return;
  }

  const wrapTop = wrap.getBoundingClientRect().top;
  const rowTops = [...new Set(chips.map((c) => Math.round(c.getBoundingClientRect().top - wrapTop)))].sort((a, b) => a - b);
  if (rowTops.length <= 2 || projectTagsExpanded) {
    toggle.hidden = rowTops.length <= 2;
    if (rowTops.length > 2) toggle.textContent = 'less';
    return;
  }

  const row2Top = rowTops[1];
  const row2Chips = chips.filter((c) => Math.round(c.getBoundingClientRect().top - wrapTop) === row2Top);
  const row2Bottom = Math.max(...row2Chips.map((c) => c.getBoundingClientRect().bottom - wrapTop));
  const hidden = chips.filter((c) => Math.round(c.getBoundingClientRect().top - wrapTop) > row2Top).length;

  wrap.style.maxHeight = Math.ceil(row2Bottom) + 'px';
  wrap.classList.add('is-collapsed');
  toggle.hidden = false;
  toggle.textContent = `+${hidden} more`;
}

function renderProjectChips() {
  const projects = [...new Set(records.map(projectOf))].sort();
  const host = $('projectTagsWrap');
  host.innerHTML = '';
  for (const p of projects) {
    const c = document.createElement('span');
    c.className = 'chip' + (projectFilter === p ? ' on' : '');
    c.textContent = p;
    c.onclick = () => { projectFilter = projectFilter === p ? '' : p; render(); };
    host.appendChild(c);
  }
  requestAnimationFrame(() => requestAnimationFrame(updateProjectTagsCollapse));
}

function render() {
  const filtered = records.filter((r) =>
    (!outcomeFilter || r.outcome === outcomeFilter) &&
    (!projectFilter || projectOf(r) === projectFilter));
  list.innerHTML = '';
  empty.style.display = filtered.length ? 'none' : 'block';
  for (const rec of filtered) {
    const { project, title } = splitIntent(rec.task_intent);
    const src = sourceOf(rec);
    const card = document.createElement('div');
    card.className = 'card' + (openId === rec.id ? ' open' : '');
    card.innerHTML = `
      <div class="row1">
        <span class="dot ${rec.outcome || ''}"></span>
        <span class="title"></span>
        <span class="when">${fmtWhen(rec.created_at)}</span>
      </div>
      <div class="row2">
        ${project ? `<span class="tag">${project}</span>` : ''}
        ${src ? `<span class="tag src${sourceKind(src)}">${src}</span>` : ''}
        ${typeof rec.score === 'number' && rec.score > 0 ? `<span class="tag score">match ${(rec.score * 100).toFixed(0)}%</span>` : ''}
      </div>`;
    card.querySelector('.title').textContent = title.slice(0, 160);
    card.onclick = () => { openId = openId === rec.id ? null : rec.id; render(); };
    if (openId === rec.id) card.appendChild(renderDetail(rec));
    list.appendChild(card);
  }
}

function renderDetail(rec) {
  const parsed = parseApproach(rec.approach);
  const det = document.createElement('div');
  det.className = 'detail';
  det.onclick = (e) => e.stopPropagation();

  if (parsed.feedback.length) {
    const sec = document.createElement('div');
    sec.className = 'sec';
    sec.innerHTML = '<label>what you said</label>';
    const wrap = document.createElement('div');
    wrap.className = 'bubbles';
    for (const b of parsed.feedback) {
      const el = document.createElement('div');
      el.className = 'bubble';
      el.textContent = b;
      wrap.appendChild(el);
    }
    sec.appendChild(wrap);
    det.appendChild(sec);
  }
  if (parsed.finalResponse) {
    const sec = document.createElement('div');
    sec.className = 'sec';
    sec.innerHTML = '<label>final response</label>';
    const el = document.createElement('div');
    el.className = 'final';
    el.textContent = parsed.finalResponse;
    sec.appendChild(el);
    det.appendChild(sec);
  }
  if (parsed.files.length) {
    const sec = document.createElement('div');
    sec.className = 'sec';
    sec.innerHTML = '<label>files touched</label>';
    const wrap = document.createElement('div');
    wrap.className = 'files';
    for (const f of parsed.files) {
      const el = document.createElement('span');
      el.className = 'file';
      el.textContent = f;
      wrap.appendChild(el);
    }
    sec.appendChild(wrap);
    det.appendChild(sec);
  }
  if (rec.tools_used && rec.tools_used.length) {
    const sec = document.createElement('div');
    sec.className = 'sec';
    sec.innerHTML = '<label>tools used</label>';
    const wrap = document.createElement('div');
    wrap.className = 'files';
    for (const t of rec.tools_used) {
      const el = document.createElement('span');
      el.className = 'file';
      el.textContent = t;
      wrap.appendChild(el);
    }
    sec.appendChild(wrap);
    det.appendChild(sec);
  }
  if (rec.failure_points) {
    const sec = document.createElement('div');
    sec.className = 'sec';
    sec.innerHTML = '<label>failure</label>';
    const el = document.createElement('div');
    el.className = 'fail';
    el.textContent = rec.failure_points;
    sec.appendChild(el);
    det.appendChild(sec);
  }
  const actions = document.createElement('div');
  actions.className = 'actions';
  const copyBtn = document.createElement('button');
  copyBtn.textContent = 'copy';
  copyBtn.onclick = () => {
    const text = `${rec.task_intent}\n\n${rec.approach}`;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'copied ✓';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'copy'; copyBtn.classList.remove('copied'); }, 1400);
    }).catch(() => {});
  };
  actions.appendChild(copyBtn);
  det.appendChild(actions);
  return det;
}

document.querySelectorAll('.chip[data-k="outcome"]').forEach((c) => {
  c.onclick = () => {
    outcomeFilter = c.dataset.v;
    document.querySelectorAll('.chip[data-k="outcome"]').forEach((x) => x.classList.toggle('on', x === c));
    render();
  };
});

async function load(q) {
  status.textContent = 'loading…';
  try {
    const url = q ? `/api/conversations?q=${encodeURIComponent(q)}&limit=60` : '/api/conversations?limit=150';
    records = await (await fetch(url)).json();
    if (!Array.isArray(records)) records = [];
  } catch (e) {
    records = [];
    status.textContent = 'failed to load — is the hub server running?';
    render();
    return;
  }
  status.textContent = records.length ? `${records.length} session${records.length === 1 ? '' : 's'}` +
    (q ? ` matching "${q}"` : '') : '';
  renderProjectChips();
  render();
}

search.addEventListener('input', () => {
  clearTimeout(searchT);
  searchT = setTimeout(() => load(search.value.trim()), 350);
});
$('refresh').onclick = () => load(search.value.trim());
$('projectTagsMore').onclick = () => {
  projectTagsExpanded = !projectTagsExpanded;
  updateProjectTagsCollapse();
};
window.addEventListener('resize', () => {
  projectTagsExpanded = false;
  requestAnimationFrame(() => requestAnimationFrame(updateProjectTagsCollapse));
});

load('');
</script>
</body>
</html>
